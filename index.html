<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Briefing"/>
<meta name="theme-color" content="#1A1613"/>
<meta name="format-detection" content="telephone=no"/>
<title>Briefing Diario</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%231A1613'/%3E%3Ccircle cx='90' cy='90' r='56.7' fill='none' stroke='%23E39A3B' stroke-width='9.9'/%3E%3Ccircle cx='90' cy='90' r='31.5' fill='none' stroke='%23FAF7F1' stroke-width='9.9'/%3E%3Ccircle cx='90' cy='90' r='9.9' fill='%23E39A3B'/%3E%3C/svg%3E"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#1A1613; --surface:#24201B; --surface2:#2E2922; --border:#3A342C;
    --text:#FAF7F1; --muted:#DDD6C9; --faint:#ADA496; --ghost:#867D71;
    --amber:#E39A3B; --amber-soft:rgba(227,154,59,0.13);
    --teal:#46A29A; --teal-soft:rgba(70,162,154,0.13);
    --sage:#93B072; --clay:#C9805A;
    --ess:#ad8522; --ext:#8477f3;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  html,body{background:var(--bg);overscroll-behavior:none;-webkit-text-size-adjust:100%}
  body{
    color:var(--text);font-family:var(--sans);min-height:100vh;
    padding:calc(18px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  }
  input,textarea,pre,.selectable{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
  button{-webkit-appearance:none;appearance:none;touch-action:manipulation}
  button,input{font-family:var(--sans)}
  .mono{font-family:var(--mono)}
  .wrap{max-width:560px;margin:0 auto}
  .loading{color:var(--muted);min-height:60vh;display:grid;place-items:center}

  /* ---- frase del día ---- */
  .quote{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--amber);
         border-radius:11px;padding:13px 15px;margin-bottom:16px}
  .quote .qt{font-size:14.5px;line-height:1.6;color:var(--text);font-weight:500}
  .quote .qk{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--amber);margin-bottom:8px}

  .hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;gap:12px}
  .kicker{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--faint)}
  .hdr .kicker{margin-bottom:6px}
  .hdate{font-size:15.5px;color:var(--muted);line-height:1.35}
  .htitle{font-size:19px;font-weight:600;color:var(--text)}
  /* cabecera compacta: saludo en una línea, y debajo fecha + toggle */
  .hdr2{margin-bottom:16px}
  .hdr2 .greet{margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:1.5px}
  .hdr-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .hdr-row .hdate{white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .modes{display:flex;gap:4px;background:var(--surface);padding:4px;border-radius:12px;border:1px solid var(--border);flex-shrink:0}
  .modebtn{display:flex;align-items:center;gap:5px;padding:7px 10px;border-radius:9px;border:none;cursor:pointer;font-size:12px;font-weight:600;background:transparent;color:var(--muted)}
  .modebtn.on-am{background:var(--amber);color:var(--bg)}
  .modebtn.on-pm{background:var(--teal);color:var(--bg)}

  .intro{font-size:14px;line-height:1.55;color:var(--muted);margin:2px 0 18px;padding-left:12px;border-left:2px solid var(--amber)}
  .intro.pm{border-left-color:var(--teal)}
  .intro.calm{border-left-color:var(--faint);font-size:13.5px}

  .section{margin-bottom:24px}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:7px}
  /* cuando el título no lleva texto de ayuda debajo, un poco de aire antes del bloque */
  .sec-head + .row,.sec-head + .pool,.sec-head + .goal{margin-top:12px}
  .sec-label{font-size:13px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--text)}
  .hint{font-size:13px;color:var(--muted);margin-bottom:12px;line-height:1.5}
  .minibtn{background:transparent;border:none;font-size:13px;font-weight:600;cursor:pointer;color:var(--amber);flex-shrink:0}
  .minibtn.ghost{color:var(--muted)}
  .minibtn.teal{color:var(--teal)}

  .row{display:flex;gap:8px}
  .inp{flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 13px;color:var(--text);font-size:16px;outline:none}
  .inp::placeholder{color:var(--ghost)}
  .inp.sm{font-size:15px;padding:9px 11px}
  .inp.mask{-webkit-text-security:disc;text-security:disc;letter-spacing:1px}
  .iconbtn{border:1px solid var(--amber);border-radius:10px;padding:0 12px;cursor:pointer;display:grid;place-items:center;background:var(--amber-soft);color:var(--amber);flex-shrink:0}
  .iconbtn.teal{border-color:var(--teal);background:var(--teal-soft);color:var(--teal)}

  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .chip{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:6px 11px;font-size:12.5px;color:var(--muted);cursor:pointer}
  .chip.on{color:var(--text);font-weight:600}
  .cdot{width:8px;height:8px;border-radius:3px;flex-shrink:0}

  .pool{display:flex;flex-direction:column;gap:6px;margin-top:12px}
  .pool-item{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 10px}
  .pool-item.top{border-color:var(--amber)}
  .pool-item.xtra{border-color:var(--ext)}
  .rank,.xbtn{width:26px;height:26px;flex-shrink:0;border-radius:8px;border:1px solid var(--faint);background:transparent;color:var(--muted);font-family:var(--mono);font-size:13px;font-weight:700;cursor:pointer;display:grid;place-items:center}
  .pool-item.top .rank{border-color:var(--amber);background:var(--amber);color:var(--bg)}
  .xbtn{font-size:15px;line-height:1}
  .pool-item.xtra .xbtn{border-color:var(--ext);background:var(--ext);color:#fff}
  .adot{width:22px;height:22px;flex-shrink:0;border-radius:7px;border:none;background:transparent;cursor:pointer;display:grid;place-items:center}
  .adot i{display:block;width:10px;height:10px;border-radius:3px}
  .pool-text{flex:1;font-size:14px;color:var(--text);min-width:0;word-break:break-word;line-height:1.35}
  .tagfrom{display:inline-block;font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--clay);border:1px solid var(--clay);border-radius:5px;padding:1px 5px;margin-right:6px;vertical-align:1px}
  .ghostx{background:transparent;border:none;color:var(--faint);cursor:pointer;padding:2px;display:grid;place-items:center;flex-shrink:0}
  .empty{font-size:13.5px;color:var(--muted);font-style:italic;padding:6px 2px}

  .legend2{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
  .legend2 b{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:6px;font-family:var(--mono);font-size:11px;margin-right:5px;vertical-align:-4px}
  .legend2 .l3 b{background:var(--amber);color:var(--bg)}
  .legend2 .lx b{background:var(--ext);color:#fff}

  .carry{display:flex;align-items:flex-start;gap:9px;background:var(--surface);border:1px solid var(--clay);border-radius:10px;padding:11px 13px;margin-bottom:12px}
  .carry .ct{font-size:13px;color:var(--text);line-height:1.5}
  .carry .ci{color:var(--clay);flex-shrink:0;margin-top:1px}

  .slots{display:flex;flex-direction:column;gap:8px}
  .slot{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px 14px}
  .slot.filled{background:var(--amber-soft);border-color:var(--amber)}
  .slot-n{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--faint);width:26px;flex-shrink:0}
  .slot.filled .slot-n{color:var(--amber)}
  .slot-t{font-size:15px;color:var(--faint);min-width:0;word-break:break-word}
  .slot.filled .slot-t{color:var(--text)}

  .times{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:end;max-width:100%}
  .tfield{display:flex;flex-direction:column;gap:5px;min-width:0;max-width:100%}
  .tfield span{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
  .tfield input{font-family:var(--mono);font-size:17px;font-weight:700;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 8px;width:100%;max-width:100%;min-width:0;text-align:center;-webkit-appearance:none;appearance:none}
  .tfield.accent input{color:var(--amber)}
  .band{margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--muted);border-radius:10px;padding:12px 16px}
  .band .band-time{font-family:var(--mono);font-size:16px;font-weight:700;letter-spacing:1px;color:var(--muted)}
  .band .band-label{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);text-align:right}
  .band.open{border-color:var(--amber)} .band.open .band-time,.band.open .band-label{color:var(--amber)}
  .band.post{border-color:var(--clay)} .band.post .band-time,.band.post .band-label{color:var(--clay)}

  .dailies{display:flex;flex-direction:column;gap:7px}
  .daily{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--text)}
  .daily .dtext{flex:1;min-width:0;word-break:break-word}

  .brief-pre{font-family:var(--mono);font-size:12.5px;line-height:1.7;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;white-space:pre-wrap;margin:0}
  .bigbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:700;cursor:pointer}
  .bigbtn.am{background:var(--amber);color:var(--bg);margin-top:10px}
  .bigbtn.pm{background:var(--teal);color:var(--bg)}
  .bigbtn.ghost{background:var(--surface);border:1px solid var(--border);color:var(--text);font-weight:600}
  .bigbtn[disabled]{opacity:.45}
  .recbtn{width:100%}
  .bigbtn.rec{background:var(--clay);color:var(--bg);animation:recpulse 1.35s ease-in-out infinite}
  @keyframes recpulse{0%,100%{opacity:1}50%{opacity:.7}}
  .recbtn.proc svg{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .checkrow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 13px}
  .checkrow.done{background:var(--teal-soft);border-color:var(--teal)}
  .checkrow.ex{border-left:3px solid var(--ext)}
  .cbox{width:24px;height:24px;flex-shrink:0;border-radius:7px;border:1px solid var(--faint);background:transparent;color:var(--bg);display:grid;place-items:center}
  .checkrow.done .cbox{border-color:var(--teal);background:var(--teal)}
  .cnum{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--faint);flex-shrink:0}
  .checkrow.done .cnum{color:var(--teal)}
  .ctext{flex:1;font-size:14.5px;color:var(--text);min-width:0;word-break:break-word}
  .checkrow.done .ctext{color:var(--muted);text-decoration:line-through}
  .cpts{font-family:var(--mono);font-size:12px;color:var(--faint);flex-shrink:0}

  .closebox{background:var(--teal-soft);border:1px solid var(--teal);border-radius:12px;padding:16px;margin-top:8px}
  .closebox p{font-size:13.5px;color:var(--muted);margin-bottom:12px;line-height:1.55}
  .closebox p b{color:var(--text)}

  .closed{text-align:center;padding:40px 8px 8px}
  .closed .ring{width:60px;height:60px;border-radius:50%;border:2px solid var(--teal);display:grid;place-items:center;margin:0 auto 20px;color:var(--teal)}
  .closed h2{font-size:22px;font-weight:600;margin-bottom:10px}
  .closed p{font-size:15px;color:var(--muted);line-height:1.6;max-width:340px;margin:0 auto 8px}

  /* ---- tarjetas / stats ---- */
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .cards.two{grid-template-columns:repeat(2,1fr)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 11px}
  .card .cv{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--text);line-height:1.1}
  .card .ck{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-top:5px}

  /* ---- gráfico de barras apiladas ---- */
  .chartwrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 13px 11px}
  .chart{display:flex;align-items:flex-end;gap:3px;height:128px;border-bottom:1px solid var(--border)}
  .col{flex:1;min-width:0;display:flex;flex-direction:column-reverse;justify-content:flex-start;height:100%;cursor:pointer;background:transparent;border:none;padding:0}
  .col.sel{background:rgba(250,247,241,0.07);border-radius:4px 4px 0 0}
  .seg{width:100%}
  .seg.r{border-radius:4px 4px 0 0}
  .seg.gap{margin-bottom:2px}
  .col .zero{height:2px;width:100%;background:var(--border);border-radius:2px}
  .axis{display:flex;gap:3px;margin-top:7px}
  .axis span{flex:1;min-width:0;text-align:center;font-size:9.5px;color:var(--faint);white-space:nowrap;overflow:hidden}
  .readout{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:11px;padding-top:11px;border-top:1px solid var(--border);flex-wrap:wrap}
  .readout .rd{font-size:13px;color:var(--text);font-weight:600}
  .readout .rv{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
  .readout .rv b{color:var(--text)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
  .lg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .lg b{color:var(--text)}

  /* ---- barras horizontales por área ---- */
  .hbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .hbar-n{font-size:13px;color:var(--text);width:92px;flex-shrink:0;display:flex;align-items:center;gap:7px;min-width:0}
  .hbar-n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hbar-t{flex:1;min-width:0;height:12px;background:var(--surface2);border-radius:4px;overflow:hidden}
  .hbar-f{height:100%;border-radius:4px;min-width:2px}
  .hbar-v{font-family:var(--mono);font-size:12.5px;color:var(--text);width:52px;text-align:right;flex-shrink:0}

  .splitbar{display:flex;height:14px;border-radius:5px;overflow:hidden;background:var(--surface2);gap:2px}
  .splitbar i{display:block;height:100%}

  /* ---- nivel / mundo ---- */
  .hero{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px}
  .hero-top{display:flex;align-items:center;gap:14px}
  .lvlring{width:62px;height:62px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;position:relative}
  .lvlring .in{width:52px;height:52px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:21px;color:var(--amber)}
  .hero-meta{flex:1;min-width:0}
  .hero-world{font-size:16px;font-weight:600;color:var(--text)}
  .hero-sub{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.45}
  .xpbar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-top:9px}
  .xpbar i{display:block;height:100%;background:var(--amber);border-radius:4px}
  .stars{display:flex;gap:3px;margin-top:10px;flex-wrap:wrap}
  .st{color:var(--faint)} .st.on{color:var(--amber)}

  .worlds{display:flex;flex-direction:column;gap:7px;margin-top:4px}
  .wrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
  .wrow.cur{border-color:var(--amber)}
  .wrow.done{opacity:.6}
  .wn{font-size:13.5px;color:var(--text);flex:1;min-width:0;font-weight:600}
  .wn .hero-sub{font-weight:400}
  .wl{font-family:var(--mono);font-size:11px;color:var(--faint);flex-shrink:0}
  .wbadge{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;font-family:var(--mono);font-size:12px;font-weight:700;background:var(--surface2);color:var(--muted)}
  .wrow.cur .wbadge{background:var(--amber);color:var(--bg)}
  .wrow.done .wbadge{background:var(--teal);color:var(--bg)}

  /* ---- tienda ---- */
  .shop{display:flex;flex-direction:column;gap:8px}
  .sitem{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 12px}
  .sitem.can{border-color:var(--sage)}
  .sname{flex:1;font-size:14px;color:var(--text);min-width:0;word-break:break-word}
  .scost{font-family:var(--mono);font-size:13px;color:var(--amber);flex-shrink:0}
  .buy{border:1px solid var(--sage);background:transparent;color:var(--sage);border-radius:9px;padding:7px 12px;font-size:12.5px;font-weight:700;cursor:pointer;flex-shrink:0}
  .buy[disabled]{border-color:var(--border);color:var(--faint);cursor:default}
  .plist{display:flex;flex-direction:column;gap:6px}
  .prow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--text)}
  .prow .pd{font-family:var(--mono);font-size:11.5px;color:var(--muted);flex-shrink:0}

  /* ---- histórico lista ---- */
  .dlist{display:flex;flex-direction:column;gap:7px}
  .dcard{background:var(--surface);border:1px solid var(--border);border-radius:11px;overflow:hidden}
  .dhead{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:none;padding:11px 12px;cursor:pointer}
  .dday{font-size:13.5px;color:var(--text);flex:1;min-width:0}
  .dstars{font-size:11px;color:var(--amber);letter-spacing:1px;flex-shrink:0}
  .dpts{font-family:var(--mono);font-size:12.5px;color:var(--text);flex-shrink:0}
  .dwork{font-size:11px;color:var(--teal);flex-shrink:0}
  .dbody{padding:0 12px 12px;border-top:1px solid var(--border);padding-top:10px}
  .dline{display:flex;align-items:flex-start;gap:8px;font-size:13.5px;color:var(--muted);margin-bottom:6px}
  .dline .dm{flex-shrink:0;font-family:var(--mono);font-size:11px;width:14px}
  .dline.ok .dm{color:var(--teal)} .dline.no .dm{color:var(--faint)}
  .dline .dt{min-width:0;word-break:break-word}

  /* ---- ajustes ---- */
  .fld{margin-bottom:16px}
  .fld label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:6px}
  .note{font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:8px}
  .note b{color:var(--text)}
  .status{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-top:10px}
  .dot2{width:8px;height:8px;border-radius:50%;background:var(--faint);flex-shrink:0}
  .dot2.ok{background:var(--sage)} .dot2.warn{background:var(--amber)} .dot2.err{background:var(--clay)}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap}
  .btnrow button{flex:1;min-width:120px;border-radius:10px;padding:11px;font-size:13.5px;font-weight:600;cursor:pointer;background:var(--surface);border:1px solid var(--border);color:var(--text);display:flex;align-items:center;justify-content:center;gap:7px}
  .btnrow button.acc{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
  .btnrow button.dgr{border-color:var(--clay);color:var(--clay);background:transparent}
  .hidefile{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
  .swrow{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 13px}
  .swrow .sw-t{font-size:13.5px;color:var(--text)}
  .sw{width:46px;height:27px;border-radius:999px;border:1px solid var(--border);background:var(--surface2);flex-shrink:0;position:relative;cursor:pointer;padding:0}
  .sw i{position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:var(--faint);transition:left .15s,background .15s}
  .sw.on{background:var(--amber-soft);border-color:var(--amber)}
  .sw.on i{left:22px;background:var(--amber)}

  /* ---- toast ---- */
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:13px;padding:10px 16px;border-radius:999px;z-index:80;box-shadow:0 6px 24px rgba(0,0,0,.45);max-width:88vw;text-align:center}

  /* ---- barra de pestañas ---- */
  .tabs{position:fixed;left:0;right:0;bottom:0;display:flex;gap:4px;background:rgba(26,22,19,0.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--border);padding:7px 10px calc(7px + env(safe-area-inset-bottom));z-index:60}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:transparent;border:none;color:var(--muted);font-size:10.5px;font-weight:600;padding:6px 2px;border-radius:11px;cursor:pointer}
  .tab.on{color:var(--amber);background:var(--amber-soft)}

  .tabs.hidden{display:none}

  /* ---- anillo vacío del botón de Las 3 ---- */
  .rdot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--faint);display:block}
  .pool-item.top .rank .rdot{display:none}

  /* ---- acordeón de ajustes ---- */
  .section.acc{margin-bottom:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .acc-head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:transparent;border:none;padding:15px 14px;cursor:pointer;text-align:left;color:var(--text)}
  .acc-ch{color:var(--faint);display:flex;transition:transform .22s ease}
  .section.acc.open .acc-ch{transform:rotate(180deg)}
  .section.acc.open .acc-head{color:var(--amber)}
  .section.acc.open .acc-head .sec-label{color:var(--amber)}
  .acc-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
  .section.acc.open .acc-body{max-height:1600px}
  .acc-in{padding:0 14px 15px}
  .acc-right{margin-top:12px}

  /* ---- cierre del día ---- */
  .okline{color:var(--sage)!important}
  .noline{color:var(--faint)!important}
  .cstars{margin-top:18px}
  .ctotal{margin-top:10px;font-size:13px;color:var(--muted)}
  .clines{margin:22px auto 0;max-width:340px;text-align:left}
  .closed .cl{display:flex;align-items:flex-start;gap:9px;font-size:14px;color:var(--text);line-height:1.55;margin:0 0 11px;max-width:none}
  .closed .cl svg{color:var(--amber);flex-shrink:0;margin-top:3px}
  .cbtn{margin-top:22px}
  .closed.anim .ring{animation:ringin .55s cubic-bezier(.2,.9,.3,1.3) both}
  .closed.anim h2{animation:fadeup .5s ease .18s both}
  .closed.anim>p{animation:fadeup .5s ease .3s both}
  .closed.anim .cstars{animation:fadeup .5s ease .42s both}
  .closed.anim .ctotal{animation:fadeup .5s ease .5s both}
  .closed.anim .cl{opacity:0;animation:fadeup .5s ease both}
  .closed.anim .cbtn{animation:fadeup .5s ease 2.1s both}
  @keyframes ringin{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
  @keyframes fadeup{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

  /* ---- doble confirmación de canje ---- */
  .sitem.asking{border-color:var(--amber);background:var(--surface2)}
  .buy.yes{border-color:var(--amber);color:var(--bg);background:var(--amber)}
  .buy.no{border-color:var(--border);color:var(--muted)}
  .askline{font-size:12.5px;color:var(--muted);line-height:1.5;padding:2px 4px 4px}

  /* ---- superposiciones ---- */
  /* ---- entrada del dia ---- */
  .intro-s{position:fixed;inset:0;z-index:120;background:var(--bg);display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top) + 34px) 22px 34px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .intro-in{width:100%;max-width:360px;margin:auto 0}
  .intro-in.splash{cursor:pointer}
  .splash-tap{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ghost);margin-top:28px}
  .i-r{width:52px;height:52px;border-radius:15px;border:2px solid var(--amber);display:grid;place-items:center;color:var(--amber);margin-bottom:20px}
  .intro-in .ik{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--faint);margin-bottom:7px}
  .intro-in h1{font-size:28px;line-height:1.22;font-weight:600;color:var(--text);margin:0 0 18px;letter-spacing:-.3px}
  .i-q{border-left:2px solid var(--amber);padding-left:14px;font-size:16px;line-height:1.55;color:var(--muted);margin:0 0 26px}
  .i-p{font-size:14.5px;line-height:1.55;color:var(--muted);margin:0 0 20px}
  .fadeup{opacity:0;transform:translateY(10px);animation:fu .5s cubic-bezier(.2,.7,.3,1) both}
  .d1{animation-delay:.08s} .d2{animation-delay:.3s} .d3{animation-delay:.6s} .d4{animation-delay:.95s}
  @keyframes fu{to{opacity:1;transform:none}}
  .linkbtn{display:block;width:100%;background:none;border:none;color:var(--faint);font-size:13.5px;font-weight:600;padding:13px;cursor:pointer;margin-top:2px}
  .rec-l{display:flex;flex-direction:column;gap:7px}
  .rec-i{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 12px;cursor:pointer;color:var(--muted);font-size:14.5px;font-family:inherit}
  .rec-i.on{border-color:var(--amber);color:var(--text)}
  .rec-i.ex{cursor:default;border-color:var(--teal)}
  .rec-b{flex-shrink:0;width:21px;height:21px;border-radius:6px;border:1.5px solid var(--border);display:grid;place-items:center;color:var(--bg)}
  .rec-i.on .rec-b{background:var(--amber);border-color:var(--amber)}
  .rec-i.ex .rec-b{background:var(--teal);border-color:var(--teal)}
  .rec-t{flex:1;min-width:0;line-height:1.4}
  .rec-k{flex-shrink:0;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--ghost)}
  /* ---- splash de arranque (logo aros + toca para entrar) ---- */
  .splashscreen{align-items:center}
  .splashscreen .intro-in{text-align:center;max-width:320px}
  .splashscreen .i-r{display:none}
  .splash-logo{position:relative;width:104px;height:104px;margin:0 auto 30px}
  .splash-logo .sl-ring{position:absolute;inset:0;margin:auto;border-radius:50%;border:2px solid var(--amber);opacity:0;animation:slpulse 2.6s ease-out infinite}
  .splash-logo .sl-ring:nth-child(1){width:34px;height:34px;animation-delay:0s}
  .splash-logo .sl-ring:nth-child(2){width:66px;height:66px;animation-delay:.35s}
  .splash-logo .sl-ring:nth-child(3){width:100px;height:100px;animation-delay:.7s}
  .splash-logo .sl-core{position:absolute;inset:0;margin:auto;width:13px;height:13px;border-radius:50%;background:var(--amber);box-shadow:0 0 16px var(--amber);animation:slcore 2.6s ease-in-out infinite}
  @keyframes slpulse{0%{opacity:0;transform:scale(.65)}22%{opacity:.85}100%{opacity:0;transform:scale(1.1)}}
  @keyframes slcore{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.28);opacity:.7}}
  .splash-name{font-family:var(--mono);font-size:12px;letter-spacing:4px;text-transform:uppercase;color:var(--faint);margin-bottom:16px}
  .splashscreen h1{font-size:29px;margin-bottom:0}
  .splashscreen .splash-tap{margin-top:34px}
  /* ---- overlay de grabación por voz ---- */
  .recovl{z-index:130}
  .reccard{text-align:center}
  .rec-orb{position:relative;width:98px;height:98px;margin:2px auto 22px;display:grid;place-items:center;border-radius:50%;background:var(--clay);color:#fff}
  .rec-orb svg{position:relative;z-index:2}
  .rec-orb .rec-wave{position:absolute;inset:0;border-radius:50%;border:2px solid var(--clay);opacity:0;animation:recwave 1.9s ease-out infinite}
  .rec-orb .rec-wave:nth-child(2){animation-delay:.63s}
  .rec-orb .rec-wave:nth-child(3){animation-delay:1.26s}
  .rec-orb.proc{background:var(--surface2);color:var(--amber)}
  .rec-orb.proc svg{animation:spin 1s linear infinite}
  @keyframes recwave{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(1.85)}}
  @media (prefers-reduced-motion:reduce){ .fadeup{animation-duration:.01s;animation-delay:0s} .sl-ring,.rec-wave{animation:none;opacity:.25} }
  .ovl{position:fixed;inset:0;z-index:90;background:rgba(16,13,11,.82);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:22px;animation:fadein .25s ease both}
  .ovlcard{position:relative;overflow:hidden;width:100%;max-width:340px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:26px 22px 22px;text-align:center;animation:pop .4s cubic-bezier(.2,.9,.3,1.25) both}
  .ovlcard h3{font-size:20px;font-weight:600;margin:6px 0 8px}
  .ovlcard p{font-size:14px;color:var(--muted);line-height:1.55;margin:0}
  .wup-ring{width:62px;height:62px;border-radius:50%;border:2px solid var(--amber);color:var(--amber);display:grid;place-items:center;margin:0 auto 16px;animation:ringin .6s cubic-bezier(.2,.9,.3,1.3) .1s both}
  .wup-ring.gold{border-color:var(--sage);color:var(--sage)}
  .wup-b{margin:14px 0 6px;display:inline-block;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--amber);background:var(--amber-soft);border-radius:999px;padding:7px 14px}
  .wup-n{font-size:13px!important;color:var(--faint)!important;margin-top:8px!important}
  .coinfx{position:absolute;inset:0;pointer-events:none}
  .coinfx i{position:absolute;top:-14px;width:9px;height:9px;border-radius:50%;background:var(--amber);opacity:0;animation:drop 1.5s ease-in both}
  .coinfx i:nth-child(1){left:16%;animation-delay:.15s}
  .coinfx i:nth-child(2){left:34%;animation-delay:.42s;background:var(--sage)}
  .coinfx i:nth-child(3){left:52%;animation-delay:.28s}
  .coinfx i:nth-child(4){left:70%;animation-delay:.58s;background:var(--sage)}
  .coinfx i:nth-child(5){left:86%;animation-delay:.36s}
  @keyframes drop{0%{opacity:0;transform:translateY(0)}15%{opacity:1}100%{opacity:0;transform:translateY(230px)}}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  @keyframes pop{from{opacity:0;transform:scale(.9) translateY(12px)}to{opacity:1;transform:none}}

  /* ---- bienvenida ---- */
  .wel{padding:8vh 4px 40px;text-align:center;animation:fadeup .5s ease both}
  .wel-ring{width:60px;height:60px;border-radius:50%;border:2px solid var(--amber);color:var(--amber);display:grid;place-items:center;margin:0 auto 22px}
  .wel-h{font-size:26px;font-weight:600;letter-spacing:-.4px;margin:4px 0 10px}
  .wel-p{font-size:14.5px;color:var(--muted);line-height:1.6;max-width:320px;margin:0 auto 22px}
  .wel .inp{text-align:center;font-size:16px}
  .wel-modes{display:flex;flex-direction:column;gap:9px;margin:18px 0 20px;text-align:left}
  .wel-m{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 14px;cursor:pointer;color:var(--text);display:block;width:100%;text-align:left}
  .wel-m b{display:block;font-size:14.5px;font-weight:700;margin-bottom:3px}
  .wel-m span{display:block;font-size:13px;color:var(--muted);line-height:1.5}
  .wel-m.on{border-color:var(--amber);background:var(--amber-soft)}
  .wel-f{font-size:12.5px;color:var(--faint);margin-top:22px;line-height:1.6}

  .foot{text-align:center;font-size:11.5px;color:var(--faint);margin-top:36px;line-height:1.6}

  /* ---- metas / objetivos ---- */
  .goal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 14px 13px;margin-bottom:10px}
  .goal.done{opacity:.62}
  .goal-top{display:flex;align-items:flex-start;gap:9px}
  .goal-t{flex:1;min-width:0;font-size:15.5px;font-weight:700;color:var(--text);line-height:1.32;word-break:break-word}
  .cd{flex-shrink:0;display:inline-flex;align-items:center;font-family:var(--mono);font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap;letter-spacing:.2px}
  .cd.far{background:var(--teal-soft);color:var(--teal)}
  .cd.mid{background:var(--amber-soft);color:var(--amber)}
  .cd.near{background:rgba(201,128,90,.16);color:var(--clay)}
  .cd.past{background:var(--surface2);color:var(--faint)}
  .gsub{font-size:12px;color:var(--faint);margin-top:7px}
  .gbar{height:10px;background:var(--surface2);border-radius:5px;overflow:hidden;margin:11px 0 0}
  .gbar i{display:block;height:100%;border-radius:5px;min-width:2px;transition:width .3s ease}
  .gmeta{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--muted);margin-top:7px;flex-wrap:wrap}
  .gmeta b{color:var(--text);font-family:var(--mono)}
  .dots7{display:flex;gap:3px;margin:12px 0 0}
  .dots7 i{flex:1;height:6px;border-radius:3px;background:var(--surface2)}
  .dots7 i.on{background:var(--sage)}
  .ask2{display:flex;align-items:center;gap:9px;margin-top:11px}
  .ask2 .q{flex:1;min-width:0;font-size:12.5px;color:var(--muted)}
  .yn{flex-shrink:0;display:inline-flex;align-items:center;gap:5px;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;border:1px solid var(--faint);background:transparent;color:var(--muted);font-family:var(--sans)}
  .yn.si.on{background:var(--sage);border-color:var(--sage);color:var(--bg)}
  .glog{margin-top:12px;display:flex;flex-direction:column;gap:7px;border-top:1px solid var(--border);padding-top:11px}
  .glog-i{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--muted);line-height:1.4}
  .glog-i .gd{flex-shrink:0;font-family:var(--mono);font-size:10.5px;color:var(--faint);width:42px;padding-top:1px}
  .glog-i .gtag{flex-shrink:0;color:var(--teal);font-size:12px;padding-top:1px}
  .glog-i .gt{flex:1;min-width:0;word-break:break-word}
  .glog-more{font-size:12px;color:var(--faint);font-style:italic;padding-left:50px}
  .gtoggle{margin-top:12px;display:inline-flex;align-items:center;gap:6px}
  .gpanel{margin-top:12px;padding-top:13px;border-top:1px solid var(--border)}
  .ghint{font-size:12px;color:var(--faint);margin:12px 0 8px;line-height:1.45}
  .gfield{margin-top:12px}
  .gfield label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:6px}
  .gfield input[type=date]{width:100%}
  .accsum{text-transform:none;font-weight:500;letter-spacing:0;color:var(--faint);font-size:12px;margin-left:9px;font-family:var(--mono)}
  .section.acc.open .acc-head .accsum{color:var(--amber)}
  /* ---- fichaje ---- */
  .punch{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 14px}
  .punch.on{border-color:var(--amber);background:var(--amber-soft)}
  .punch-k{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
  .punch.on .punch-k{color:var(--amber)}
  .punch-time{font-size:27px;font-weight:700;color:var(--text);line-height:1.1;margin-top:3px}
  .punch.on .punch-time{color:var(--amber)}
  .punch-elapsed{font-size:13.5px;color:var(--muted);margin-top:5px}
  .punch-sess{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}
  .punch-sess .ps{font-family:var(--mono);font-size:11px;color:var(--faint);background:var(--surface2);border-radius:6px;padding:3px 7px}
  .punch-sess .ps.blk{display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
  .punch-sess .ps.blk.live{color:var(--amber);background:var(--amber-soft)}
  .punch-sess .ps.blk.done{opacity:.6}
  .blkx{background:transparent;border:none;color:var(--faint);cursor:pointer;display:inline-grid;place-items:center;padding:0;margin-left:1px}
  .blkadd{display:flex;gap:8px;align-items:flex-end;margin-top:13px}
  .blkadd .tfield{flex:1;min-width:0}
  .blkadd .tfield input{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 8px;width:100%;text-align:center;-webkit-appearance:none;appearance:none}
  .xtrarow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:13px;padding-top:12px;border-top:1px solid var(--border)}
  .xtra-k{font-size:12.5px;color:var(--muted);min-width:0}

  @media (max-width:380px){ .tfield input{font-size:16px;padding:9px 4px} .hbar-n{width:78px} .pool-item{gap:6px} .yn{padding:8px 11px} .tab span{font-size:9.5px} }
</style>

var mem={};

  try{var v=window.localStorage.getItem(k); if(v!=null) return JSON.parse(v);}catch(e){}
  return (k in mem)?mem[k]:null;
}
function sGet(k){
  return new Promise(function(res){
    try{
      if(window.storage&&window.storage.get){
        Promise.resolve(window.storage.get(k)).then(function(r){
          if(r&&r.value!=null){ try{res(JSON.parse(r.value));return;}catch(e){} }
          res(lsGet(k));
        }).catch(function(){res(lsGet(k));});
        return;
      }
    }catch(e){}
    res(lsGet(k));
  });
}
function sSet(k,v){
  mem[k]=v;
  var j=JSON.stringify(v);
  try{if(window.storage&&window.storage.set) Promise.resolve(window.storage.set(k,j)).catch(function(){});}catch(e){}
  try{window.localStorage.setItem(k,j);}catch(e){}
}

var mediaRec=null, recChunks=[];
function vacSupported(){ return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder); }
function startVac(){
  if(!vacSupported()){ toast("Tu navegador no permite grabar audio."); return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    recChunks=[];
    var mr; try{ mr=new MediaRecorder(stream); }catch(e){ try{ mr=new MediaRecorder(stream,{mimeType:"audio/mp4"}); }catch(e2){ stream.getTracks().forEach(function(t){t.stop();}); toast("No se pudo iniciar la grabación."); return; } }
    mediaRec=mr;
    mr.ondataavailable=function(ev){ if(ev.data&&ev.data.size) recChunks.push(ev.data); };
    mr.onstop=function(){
      stream.getTracks().forEach(function(t){t.stop();});
      var type=(recChunks[0]&&recChunks[0].type)||mr.mimeType||"audio/mp4";
      sendVac(new Blob(recChunks,{type:type}));
    };
    mr.start(); S.rec="rec"; render();
  }).catch(function(){ toast("Permiso de micrófono denegado."); });
}
function stopVac(){ if(mediaRec&&mediaRec.state!=="inactive"){ S.rec="proc"; render(); try{ mediaRec.stop(); }catch(e){ S.rec="idle"; render(); } } }
function sendVac(blob){
  var fr=new FileReader();
  fr.onload=function(){
    var b64=String(fr.result).split(",")[1]||"";
    var mime=(blob.type||"audio/mp4").split(";")[0];
    fetch(PUSH_URL+"/vaciado",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({audio:b64,mime:mime,topMax:topMax(),areas:(DB.areas||[]).map(function(a){return {id:a.id,name:a.name};})})})
    .then(function(r){return r.json();}).then(function(j){
      S.rec="idle";
      if(j&&Array.isArray(j.tasks)&&j.tasks.length){ ingestVac(j.tasks); }
      else { render(); toast(j&&j.error?"No se pudo procesar (reinténtalo).":"No saqué tareas de ese audio."); }
    }).catch(function(){ S.rec="idle"; render(); toast("No se pudo procesar el audio."); });
  };
  fr.onerror=function(){ S.rec="idle"; render(); toast("No se pudo leer la grabación."); };
  fr.readAsDataURL(blob);
}
function ingestVac(tasks){
  var d=day(); d.pool=d.pool||[]; d.top3=d.top3||[];
  var added=0, ess=0, ids=(DB.areas||[]).map(function(a){return a.id;});
  tasks.forEach(function(t){
    if(!t||!t.text)return;
    var ar=(ids.indexOf(t.area)>=0)?t.area:(ids[0]||"neg");
    var id=uid(), item={id:id,text:String(t.text).slice(0,160),area:ar};
    if(t.kind==="extra") item.extra=true;
    d.pool.push(item); added++;
    if(t.kind==="essential"&&d.top3.length<topMax()){ d.top3.push(id); ess++; }
  });
  d.arr=now(); touchDay(); save(); render();
  toast(added?("Añadí "+added+" tarea"+(added===1?"":"s")+(ess?" · "+ess+" esencial"+(ess===1?"":"es"):"")):"Nada que añadir");
}

/* ============ bloque de trabajo (de X a Y) ============ */
function hmToMin(s){ var p=String(s||"").split(":"); return (+p[0]||0)*60+(+p[1]||0); }
function nowMin(){ var n=new Date(); return n.getHours()*60+n.getMinutes(); }
function blocksOf(d){ d=d||day(); if(!d.blocks)d.blocks=[]; return d.blocks; }
function blockIsActive(b){ var m=nowMin(); return m>=hmToMin(b.s)&&m<hmToMin(b.e); }
function blockIsPast(b){ return nowMin()>=hmToMin(b.e); }
/* estado del bloque ahora mismo: activo / antes del próximo / terminado / ninguno */
function blockNow(d){
  var bs=blocksOf(d).slice().sort(function(a,b){return hmToMin(a.s)-hmToMin(b.s);}), m=nowMin(), act=null, next=null;
  bs.forEach(function(b){
    if(m>=hmToMin(b.s)&&m<hmToMin(b.e)){ if(!act)act=b; }
    else if(hmToMin(b.s)>m){ if(!next||hmToMin(b.s)<hmToMin(next.s))next=b; }
  });
  if(act) return {state:"active",end:act.e,remainMin:hmToMin(act.end||act.e)-m,remain:hmToMin(act.e)-m};
  if(next) return {state:"before",next:next.s,untilMin:hmToMin(next.s)-m};
  return {state:bs.length?"after":"none"};
}
/* tiempo trabajado de un día: lo transcurrido de los bloques + el tiempo extra del cronómetro */
function blocksWorkedMs(k){
  var d=DB.days[k]; if(!d)return 0;
  var isToday=(k===todayKey()), m=nowMin(), ms=0;
  (d.blocks||[]).forEach(function(b){
    var s=hmToMin(b.s), e=hmToMin(b.e); if(e<=s)return;
    var end=isToday?Math.min(e,m):e;
    if(end>s) ms+=(end-s)*60000;
  });
  return ms;
}
function workedMsForDay(k){ var d=DB.days[k]; return blocksWorkedMs(k)+(d?punchMs(d):0); }
function addBlock(){

  s=String(s||"").trim(); e=String(e||"").trim();
  if(!s||!e){toast("Pon hora de inicio y de fin.");return;}
  if(hmToMin(e)<=hmToMin(s)){toast("La hora de fin debe ser mayor que la de inicio.");return;}
  var d=day(); d.blocks=d.blocks||[]; d.blocks.push({id:uid(),s:s,e:e});
  d.blocks.sort(function(a,b){return hmToMin(a.s)-hmToMin(b.s);});

}

  ((aBase&&aBase.blocks)||[]).concat((aOther&&aOther.blocks)||[]).forEach(function(b){
    if(!b||!b.s||!b.e)return;
    var k=blockKey(b);
    if(gone[k]||seen[k])return;
    seen[k]=1; out.push(b);
  });
  out.sort(function(a,b){return hmToMin(a.s)-hmToMin(b.s);});
  return out;
}

/* ============ ¿salió todo lo que había marcado? ============ */
function dayComplete(d){
  if(!d)return false;
  var t=(d.top3||[]);
  if(!t.length)return false;
  var ok=true;
  t.forEach(function(id){ if(!(d.doneTop||{})[id])ok=false; });
  var dd=d.doneDaily||{};
  (DB.dailies||[]).forEach(function(x){ if(!dd[x.id])ok=false; });
  (d.pool||[]).forEach(function(p){
    if(!p.extra)return;
    if(t.indexOf(p.id)>=0)return;
    if(!extraEntryOf(d,p.id))ok=false;
  });
  return ok;
}
/* el bonus de cierre solo cuenta si el día salió entero.
   Los días cerrados antes de esta versión no llevan la marca: se respetan. */
function closeBonus(d){ return !!(d&&d.closed&&(d.full===undefined?true:d.full)); }

/* ============ puntos ============ */
function dayPoints(d){
  var base=0,extra=0,stars=0;
  if(!d)return {base:0,extra:0,total:0,stars:0};
  (d.top3||[]).forEach(function(id){ if(d.doneTop&&d.doneTop[id]){base+=P.top;stars++;} });
  var dd=d.doneDaily||{};
  Object.keys(dd).forEach(function(k){ if(dd[k]) base+=P.daily; });
  (d.extras||[]).forEach(function(){ extra+=P.extra; });
  if(closeBonus(d)) base+=P.close;
  return {base:base,extra:extra,total:base+extra,stars:stars};
}
/* lo mismo contando tareas en vez de puntos, para el modo simple */
function dayCount(d){
  if(!d)return {base:0,extra:0,total:0,stars:0};
  var base=0,stars=0;
  (d.top3||[]).forEach(function(id){ if((d.doneTop||{})[id]){base++;stars++;} });
  var dd=d.doneDaily||{};
  Object.keys(dd).forEach(function(k){ if(dd[k]) base++; });
  var extra=(d.extras||[]).length;
  return {base:base,extra:extra,total:base+extra,stars:stars};
}
/* la unidad que se enseña según el modo */
function dayUnits(d){ return gameOn()?dayPoints(d):dayCount(d); }
function allDayKeys(){ return Object.keys(DB.days||{}).sort(); }
function totals(){
  var base=0,extra=0,stars=0,closed=0,days=0;
  allDayKeys().forEach(function(k){
    var p=dayPoints(DB.days[k]);
    if(p.total>0)days++;
    base+=p.base;extra+=p.extra;stars+=p.stars;
    if(DB.days[k].closed)closed++;
  });
  return {base:base,extra:extra,total:base+extra,stars:stars,closed:closed,days:days};
}
function spentCoins(){ return (DB.purchases||[]).reduce(function(a,p){return a+(p.cost||0);},0); }
function coins(){ return totals().total + (DB.worldBonus||0) - spentCoins(); }

/* días seguidos con algo registrado, contando hacia atrás desde hoy.
   Solo se usa para felicitar: romperlo no penaliza nada. */
function activeStreak(){
  var n=0,d=new Date(); d.setHours(12,0,0,0);
  for(var i=0;i<400;i++){
    var k=keyOf(d), x=DB.days[k], p=x?dayCount(x):null;
    if(x&&(p.total>0||x.closed)) n++; else break;
    d.setDate(d.getDate()-1);
  }
  return n;
}
/* frases del cierre, calculadas sobre el propio historial */
function closingLines(){
  var d=day(),k=todayKey(),c=dayCount(d),p=dayPoints(d),L=[];
  var prev=allDayKeys().filter(function(x){return x<k;})
                       .map(function(x){return dayCount(DB.days[x]).total;})
                       .filter(function(v){return v>0;});
  if(prev.length>=3){
    var avg=prev.reduce(function(a,b){return a+b;},0)/prev.length;
    var best=Math.max.apply(null,prev);
    if(c.total>best) L.push("Es el día con más cosas hechas de todo tu registro.");
    else if(c.total>avg+0.5) L.push("Has ido por encima de tu media: "+c.total+" frente a "+(Math.round(avg*10)/10)+".");
    else if(c.total>=avg-0.5) L.push("Un día en tu línea de siempre.");
    else L.push("Día más corto de lo normal. Mañana el contador sigue donde lo dejas.");
  }else if(c.total>0){
    L.push("Todavía hay pocos días guardados: dentro de nada esto empieza a compararse solo.");
  }
  var st=activeStreak();
  if(st>=2) L.push("Van "+st+" días seguidos apareciendo por aquí.");
  var tn=(d.top3||[]).length;
  if(tn>0&&c.stars===tn) L.push(tn===3?"Las 3, las tres. Día redondo.":"Pleno de esenciales ("+tn+"/"+tn+"). Día redondo.");
  else if(c.stars>0) L.push(c.stars+" de "+(tn||3)+" esenciales. Lo que queda vuelve mañana sin drama.");
  else L.push("Hoy no cayó ninguna esencial, y el día sigue contando igual.");
  if(c.extra===1) L.push("Y una cosa de más que no te pedía nadie.");
  else if(c.extra>1) L.push("Y "+c.extra+" cosas de más que no te pedía nadie.");
  var cl=allDayKeys().filter(function(x){return DB.days[x].closed;}).length;
  if(cl===1) L.push("Primer cierre guardado. A partir de aquí ya hay con qué comparar.");
  else if(cl%10===0) L.push("Cierre número "+cl+".");
  if(gameOn()){
    if(closeBonus(d)) L.push("Salió todo lo que habías marcado, así que el cierre suma sus "+P.close+" puntos.");
    else L.push("Quedaba algo sin marcar, así que esta vez el cierre no suma extra. Los puntos de lo hecho son tuyos igual.");
  }
  return L.slice(0,5);
}

function levelInfo(xp){
  var lvl=1,acc=0,need=80;
  while(xp>=acc+need){ acc+=need; lvl++; need=80+40*(lvl-1); }
  return {lvl:lvl,into:xp-acc,need:need,pct:Math.round(((xp-acc)/need)*100)};
}

/* elige por fecha, con un salto grande para que no vayan en orden */
function quoteOfDay(k){
  k=k||todayKey();
  var d=dateOfKey(k);
  var idx=Math.floor(d.getTime()/86400000);
  var n=QUOTES.length;
  function gcd(a,b){while(b){var t=a%b;a=b;b=t;}return a;}
  var step=71; /* si es coprimo con n, recorre el banco entero antes de repetir */
  while(gcd(step,n)!==1) step++;
  return QUOTES[((idx*step)%n+n)%n];
}

function gh(path,opts){
  opts=opts||{};
  var h={"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
  h["Authorization"]="Bearer "+token();
  if(opts.body)h["Content-Type"]="application/json";
  return fetch("https://api.github.com"+path,{method:opts.method||"GET",headers:h,body:opts.body?JSON.stringify(opts.body):undefined})
    .then(function(r){
      return r.text().then(function(t){

          else if(r.status===404&&path.indexOf("/gists/")===0) m="Con este token no aparece ese Gist. Revisa el ID.";

  var o={},k;
  for(k in (a||{})) if(a[k])o[k]=true;
  for(k in (b||{})) if(b[k])o[k]=true;
  return o;
}
/* fusiona un mismo dia visto por dos aparatos sin perder nada de ninguno */
function mergeDay(da,db2){
  if(!dayFilled(da))return db2;
  if(!dayFilled(db2))return da;
  var base=((db2.u||0)>(da.u||0))?db2:da, other=(base===db2)?da:db2;
  /* el ORDEN (vaciado y Las 3) lo decide el lado ordenado a mano mas
     reciente (arr), no el simplemente modificado mas reciente (u). Asi el
     arrastre automatico al abrir el otro aparato no pisa tu orden. */
  var aBase=((db2.arr||0)>(da.arr||0))?db2:da, aOther=(aBase===db2)?da:db2;
  var out={},k;
  for(k in base) out[k]=base[k];
  /* lo borrado en cualquiera de los dos aparatos se queda borrado */
  var gone=mergeFlags(base.gone,other.gone), goneTs={};
  for(k in (base.gone||{})) goneTs[k]=base.gone[k];
  for(k in (other.gone||{})) if(!goneTs[k]||other.gone[k]>goneTs[k]) goneTs[k]=other.gone[k];
  out.gone=goneTs;
  var byId={},pool=[];
  (aBase.pool||[]).concat(aOther.pool||[]).forEach(function(p){
    if(!p||!p.id||byId[p.id]||gone[p.id])return; byId[p.id]=1; pool.push(p);
  });
  var seenT={},pool2=[];
  pool.forEach(function(p){
    var t=String(p.text||"").toLowerCase().trim();
    if(t&&seenT[t])return; if(t)seenT[t]=1; pool2.push(p);
  });
  out.pool=pool2;
  var inPool={}; pool2.forEach(function(p){inPool[p.id]=1;});
  var t3=(aBase.top3||[]).filter(function(id){return inPool[id];});
  if(!t3.length) t3=(aOther.top3||[]).filter(function(id){return inPool[id];});
  out.top3=t3.slice(0,topMax());
  var dtR=mergeDone(base.doneTop,other.doneTop,base.doneTopOff,other.doneTopOff);
  var dt=dtR.on; for(k in dt) if(gone[k]) delete dt[k];
  out.doneTop=dt; out.doneTopOff=dtR.off;
  var ddR=mergeDone(base.doneDaily,other.doneDaily,base.doneDailyOff,other.doneDailyOff);
  out.doneDaily=ddR.on; out.doneDailyOff=ddR.off;
  var exOff=mergeTs(base.extrasOff,other.extrasOff);
  var se={},ex=[];
  (base.extras||[]).concat(other.extras||[]).forEach(function(x){
    if(!x)return; if(gone[x.id]||(x.poolId&&gone[x.poolId]))return;
    var key=x.poolId||x.id; if(!key||se[key])return;
    /* si el extra se desmarco despues de crearse, no lo revivas */
    if(exOff[key]&&exOff[key]>(x.ts||0)){ se[key]=1; return; }
    se[key]=1; ex.push(x);
  });
  out.extras=ex;
  var exLim=now()-90*86400000; out.extrasOff={};
  for(k in exOff){ if(exOff[k]>=exLim) out.extrasOff[k]=exOff[k]; }
  out.closed=!!(base.closed||other.closed);
  out.harvested=!!(base.harvested||other.harvested);
  out.full=!!(base.full||other.full);
  out.punch=mergePunch(base.punch,other.punch,base.u||0,other.u||0);
  out.blocks=mergeBlocks(aBase,aOther,gone);
  out.u=Math.max(base.u||0,other.u||0);
  out.arr=Math.max(da.arr||0,db2.arr||0);
  return out;
}
/* une el fichaje de dos aparatos: todas las sesiones (sin duplicar), y el
   cronometro abierto del lado mas reciente si no quedo ya cerrado */
function mergePunch(pa,pb,ua,ub){
  pa=pa||{}; pb=pb||{};
  var seen={},sessions=[];
  (pa.sessions||[]).concat(pb.sessions||[]).forEach(function(x){
    if(!x||!x.s)return; var key=x.s+"-"+(x.e||0); if(seen[key])return; seen[key]=1; sessions.push(x);
  });
  sessions.sort(function(a,b){return (a.s||0)-(b.s||0);});
  var open=(ub>ua?(pb.open||pa.open):(pa.open||pb.open))||0;
  if(open){ for(var i=0;i<sessions.length;i++){ if(sessions[i].s===open&&sessions[i].e){ open=0; break; } } }
  return {open:open,sessions:sessions};
}
function pickList(newer,older,k){
  var a=newer[k],b=older[k];
  if(a==null)return b;
  if(a.length===0&&b&&b.length)return b;
  return a;
}
function mergeDB(a,b){
  /* a = local, b = remoto. Nada se borra por llegar tarde. */
  var out={v:2,sync:a.sync,days:{}};
  var nw=((b&&b.u)||0)>((a&&a.u)||0)?b:a, ol=(nw===a)?(b||{}):a;
  /* lapidas globales: diarias y recompensas borradas no vuelven, y se olvidan
     solas a los 90 dias para que la lista no crezca sin fin */
  var g={},kk,lim=now()-90*86400000;
  [(a&&a.gone)||{},(b&&b.gone)||{}].forEach(function(src){
    for(kk in src) if(src[kk]>lim && (!g[kk]||src[kk]>g[kk])) g[kk]=src[kk];
  });
  out.gone=g;
  ["dailies","areas","rewards"].forEach(function(k){
    var L=pickList(nw,ol,k);
    out[k]=(L&&L.filter)?L.filter(function(x){return !(x&&x.id&&g[x.id]);}):L;
  });
  ["carry","settings","worldBonus","seenWorld"].forEach(function(k){ out[k]=(nw[k]!=null?nw[k]:a[k]); });
  var keys={}; Object.keys(a.days||{}).forEach(function(k){keys[k]=1;}); Object.keys((b&&b.days)||{}).forEach(function(k){keys[k]=1;});
  Object.keys(keys).forEach(function(k){
    var da=(a.days||{})[k], db2=((b&&b.days)||{})[k];
    if(!da){out.days[k]=db2;return;} if(!db2){out.days[k]=da;return;}
    out.days[k]=mergeDay(da,db2);
  });
  var seen={},pu=[];
  (a.purchases||[]).concat((b&&b.purchases)||[]).forEach(function(p){ if(p&&p.id&&!seen[p.id]){seen[p.id]=1;pu.push(p);} });
  pu.sort(function(x,y){return String(x.date).localeCompare(String(y.date));});
  out.purchases=pu;
  out.metas=mergeMetas(a.metas,(b&&b.metas),g);
  out.u=Math.max((a&&a.u)||0,(b&&b.u)||0);
  return out;
}
/* fusiona una misma meta vista por dos aparatos: gana el mas reciente en las
   cifras, pero se unen los dias marcados y el registro de acciones para no
   perder nada de ninguno. Las metas borradas (lapida en gone) no vuelven. */
/* une dos mapas de {clave:timestamp} quedandose con el timestamp mas alto */
function mergeTs(a,b){
  var o={},k; a=a||{}; b=b||{};
  for(k in a)o[k]=a[k];
  for(k in b) if(!o[k]||b[k]>o[k]) o[k]=b[k];
  return o;
}
/* fusiona un mapa de "hecho" (clave->cuando se marco) con su lapida de
   "deshecho" (clave->cuando se quito): para cada clave gana la accion mas
   reciente. Asi desmarcar una tarea se respeta aunque el Gist aun la tenga
   marcada. Las lapidas viejas (90 dias) se olvidan solas. */
function mergeDone(baseOn,otherOn,baseOff,otherOff){
  var onm=mergeTs(baseOn,otherOn), offm=mergeTs(baseOff,otherOff);
  var fon={},foff={},lim=now()-90*86400000,k;
  for(k in onm){ if(onm[k] && onm[k]>=(offm[k]||0)) fon[k]=onm[k]; }
  for(k in offm){ if(offm[k]>=lim && offm[k]>(onm[k]||0)) foff[k]=offm[k]; }
  return {on:fon,off:foff};
}
function mergeMeta(a,b){
  var base=((b.u||0)>(a.u||0))?b:a, other=(base===b)?a:b, out={},k;
  for(k in base)out[k]=base[k];
  /* checks con lapida: cada dia marcado guarda cuando se marco (checks) y cada
     dia desmarcado guarda cuando se quito (checksOff). Gana la accion mas
     reciente, asi que quitar un avance se respeta aunque el otro aparato aun
     lo tenga marcado. */
  var onm=mergeTs(base.checks,other.checks), offm=mergeTs(base.checksOff,other.checksOff);
  var lim=now()-90*86400000, fon={},foff={};
  for(k in onm){ if(onm[k] && onm[k]>=(offm[k]||0)) fon[k]=onm[k]; }
  for(k in offm){ if(offm[k]>=lim && offm[k]>(onm[k]||0)) foff[k]=offm[k]; }
  out.checks=fon; out.checksOff=foff;
  var se={},log=[];
  (base.log||[]).concat(other.log||[]).forEach(function(x){ if(x&&x.id&&!se[x.id]){se[x.id]=1;log.push(x);} });
  log.sort(function(x,y){return String(x.date).localeCompare(String(y.date));});
  out.log=log;
  out.u=Math.max(base.u||0,other.u||0);
  return out;
}
function mergeMetas(la,lb,gone){
  var by={},order=[];
  function take(list){ (list||[]).forEach(function(m){
    if(!m||!m.id||(gone&&gone[m.id]))return;
    if(!by[m.id]){by[m.id]=m;order.push(m.id);} else by[m.id]=mergeMeta(by[m.id],m);
  }); }
  take(la); take(lb);
  return order.map(function(id){return by[id];});
}

function syncNow(silent){
  if(!token()){ SY={state:"off",msg:"sin token"}; if(!silent)render(); return Promise.resolve(); }
  SY={state:"busy",msg:"Sincronizando…"}; if(!silent)render(); else paintSyncDot();
  var gid=DB.sync.gistId;
  var chain;
  if(!gid){
    chain=gh("/gists",{method:"POST",body:{description:"Briefing Diario · datos privados",public:false,
      files:(function(){var f={};f[FILE]={content:JSON.stringify(payload(),null,1)};return f;})()}})
      .then(function(g){ DB.sync.gistId=g.id; return null; });
  }else{
    chain=gh("/gists/"+gid).then(function(g){
      var f=g&&g.files&&g.files[FILE];
      if(!f||!f.content)return null;
      try{return JSON.parse(f.content);}catch(e){return null;}
    }).then(function(remote){
      if(remote){ var m=mergeDB(DB,remote); m.sync=DB.sync; DB=m; }
      return gh("/gists/"+gid,{method:"PATCH",body:{files:(function(){var f={};f[FILE]={content:JSON.stringify(payload(),null,1)};return f;})()}});
    });
  }
  return chain.then(function(){
    DB.sync.lastSync=now();
    sSet(KDB,DB);
    SY={state:"ok",msg:"Al día"};
    render();
  }).catch(function(e){
    SY={state:"err",msg:String(e&&e.message||e).slice(0,90)};
    if(!silent){render();} else {paintSyncDot();}
  });
}
function paintSyncDot(){
  var el=document.getElementById("syncdot");
  if(el)el.className="dot2 "+(SY.state==="ok"?"ok":SY.state==="err"?"err":SY.state==="busy"?"warn":"");
  var tx=document.getElementById("synctxt");
  if(tx)tx.textContent=syncLabel();
}
function syncLabel(){
  if(!token())return "Sin conectar";
  if(SY.state==="busy")return "Sincronizando…";
  if(SY.state==="err")return "Error: "+SY.msg;
  if(DB.sync.lastSync){
    var d=new Date(DB.sync.lastSync);
    return "Al día · "+pad(d.getHours())+":"+pad(d.getMinutes());
  }
  return "Conectado";
}

/* ============ HISTÓRICO ============ */
/* ---- horas fichadas agregadas ---- */
function weekStartKey(){ var d=new Date(); d.setHours(12,0,0,0); var wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return keyOf(d); }
function sumWorkedSince(fromKey){ var tot=0; allDayKeys().forEach(function(k){ if(k>=fromKey){ if(DB.days[k])tot+=workedMsForDay(k); } }); return tot; }
function sumWorkedAll(){ var tot=0; allDayKeys().forEach(function(k){ tot+=workedMsForDay(k); }); return tot; }
/* metas en las que avanzaste un día concreto, con las acciones que apuntaste */
function metasAdvancedOn(k){
  var out=[];
  (DB.metas||[]).forEach(function(m){
    if((m.checks||{})[k]){
      var acts=(m.log||[]).filter(function(x){return x.date===k;}).map(function(x){return x.text;});
      out.push({title:m.title,color:areaColor(m.area),actions:acts});
    }
  });
  return out;
}
function renderHist(){
  var h='<div class="hdr"><div><div class="kicker">Histórico</div><div class="htitle">Día a día</div></div></div>';
  var t=totals();
  var wToday=workedMsForDay(todayKey()),wWeek=sumWorkedSince(weekStartKey()),wAll=sumWorkedAll();
  h+='<div class="cards" style="margin-bottom:'+(wAll>0?'8px':'24px')+'">'+
     '<div class="card"><div class="cv">'+t.days+'</div><div class="ck">días con registro</div></div>'+
     '<div class="card"><div class="cv">'+t.closed+'</div><div class="ck">cierres</div></div>'+
     '<div class="card"><div class="cv">'+t.stars+'</div><div class="ck">estrellas</div></div>'+
     '</div>';
  if(wAll>0){
    h+='<div class="cards" style="margin-bottom:24px">'+
       '<div class="card"><div class="cv" style="font-size:18px;color:var(--teal)">'+fmtHm(wToday)+'</div><div class="ck">fichado hoy</div></div>'+
       '<div class="card"><div class="cv" style="font-size:18px;color:var(--teal)">'+fmtHm(wWeek)+'</div><div class="ck">esta semana</div></div>'+
       '<div class="card"><div class="cv" style="font-size:18px;color:var(--teal)">'+fmtHm(wAll)+'</div><div class="ck">total fichado</div></div>'+
       '</div>';
  }

  /* gráfico de barras apiladas, 14 días */
  var keys=lastNDays(14);
  var data=keys.map(function(k){var p=dayUnits(DB.days[k]);return {k:k,p:p};});
  var max=Math.max.apply(null,data.map(function(x){return x.p.total;}).concat([1]));
  if(!S.selDay||keys.indexOf(S.selDay)<0){
    var withData=data.filter(function(x){return x.p.total>0;});
    S.selDay=withData.length?withData[withData.length-1].k:keys[keys.length-1];
  }
  var ch='<div class="chartwrap"><div class="chart">';
  data.forEach(function(x){
    var hb=Math.round((x.p.base/max)*100), he=Math.round((x.p.extra/max)*100);
    ch+='<button class="col'+(S.selDay===x.k?' sel':'')+'" data-action="sel-day" data-id="'+x.k+'" aria-label="'+esc(shortDate(x.k))+'">';
    if(x.p.total===0){ ch+='<i class="zero"></i>'; }
    else{
      ch+='<i class="seg'+(he>0?' gap':' r')+'" style="height:'+Math.max(hb,hb>0?3:0)+'%;background:var(--ess)"></i>';
      if(he>0) ch+='<i class="seg r" style="height:'+Math.max(he,3)+'%;background:var(--ext)"></i>';
    }
    ch+='</button>';
  });
  ch+='</div><div class="axis">';
  data.forEach(function(x,i){ ch+='<span>'+((i%3===1)?esc(tinyDate(x.k)):'')+'</span>'; });
  ch+='</div>';
  var sel=dayUnits(DB.days[S.selDay]);
  ch+='<div class="readout"><span class="rd">'+esc(prettyDate(S.selDay))+'</span>'+
      '<span class="rv">'+sel.base+' esenciales · '+sel.extra+' extra · <b>'+sel.total+'</b>'+(gameOn()?' pts':' hechas')+' · '+sel.stars+'★</span></div>';
  ch+='<div class="legend">'+
      '<span class="lg"><i class="cdot" style="background:var(--ess)"></i>Esenciales</span>'+
      '<span class="lg"><i class="cdot" style="background:var(--ext)"></i>Extras</span>'+
      '<span class="lg"><i class="cdot" style="background:var(--border)"></i>Sin registro</span>'+
      '</div></div>';
  h+=section('Últimos 14 días','Toca una barra para ver el detalle. Los huecos son huecos, no fallos.',ch);

  /* lista detallada */
  var ks=allDayKeys().slice().reverse();
  var list='<div class="dlist">';
  if(!ks.length) list+='<div class="empty">Todavía no hay días guardados.</div>';
  ks.slice(0,60).forEach(function(k){
    var d=DB.days[k],p=dayUnits(d),open=(S.openDay===k);
    var dwms=workedMsForDay(k);
    list+='<div class="dcard"><button class="dhead" data-action="open-day" data-id="'+k+'">'+
      '<span class="dday">'+esc(weekShort(k))+' · '+esc(shortDate(k))+'</span>'+
      (dwms>60000?'<span class="dwork mono">'+fmtHm(dwms)+'</span>':'')+
      starsRow(p.stars,(d.top3||[]).length||3,11)+
      '<span class="dpts">'+p.total+'</span></button>';
    if(open){
      list+='<div class="dbody">';
      var pmap={}; (d.pool||[]).forEach(function(x){pmap[x.id]=x;});
      if((d.top3||[]).length){
        list+='<div class="hint" style="margin-bottom:7px">Esenciales</div>';
        (d.top3||[]).forEach(function(id){
          var ok=!!(d.doneTop||{})[id], it=pmap[id]||{text:"—"};
          list+='<div class="dline '+(ok?'ok':'no')+'"><span class="dm">'+(ok?'✓':'·')+'</span>'+
            '<i class="cdot" style="background:'+areaColor(it.area)+';margin-top:5px"></i>'+
            '<span class="dt">'+esc(it.text)+'</span></div>';
        });
      }else list+='<div class="empty" style="padding:0 0 6px">Sin las 3 elegidas.</div>';
      var dd=Object.keys(d.doneDaily||{}).filter(function(x){return d.doneDaily[x];});
      if(dd.length){
        list+='<div class="hint" style="margin:10px 0 7px">Diarias comprobadas ('+dd.length+')</div>';
        var dmap={}; (DB.dailies||[]).forEach(function(x){dmap[x.id]=x;});
        dd.forEach(function(id){
          var it=dmap[id];
          list+='<div class="dline ok"><span class="dm">✓</span><span class="dt">'+esc(it?it.text:"(diaria eliminada)")+'</span></div>';
        });
      }
      if((d.extras||[]).length){
        list+='<div class="hint" style="margin:10px 0 7px">Extras</div>';
        (d.extras||[]).forEach(function(x){
          list+='<div class="dline ok"><span class="dm">+</span>'+
            '<i class="cdot" style="background:'+areaColor(x.area)+';margin-top:5px"></i>'+
            '<span class="dt">'+esc(x.text)+'</span></div>';
        });
      }
      var madv=metasAdvancedOn(k);
      if(madv.length){
        list+='<div class="hint" style="margin:10px 0 7px">Metas en las que avanzaste</div>';
        madv.forEach(function(m){
          list+='<div class="dline ok"><span class="dm" style="color:'+m.color+'">◆</span>'+
            '<span class="dt"><b>'+esc(m.title)+'</b>'+(m.actions.length?' — '+esc(m.actions.join(' · ')):'')+'</span></div>';
        });
      }
      var wms=workedMsForDay(k);
      if(wms>60000) list+='<div class="hint" style="margin:10px 0 7px">Fichaje · '+fmtHm(wms)+' trabajados</div>';
      list+='<div class="readout"><span class="rv">'+p.base+' esenciales · '+p.extra+' extra</span>'+
            '<span class="rv">'+(d.closed?'Día cerrado':'Sin cerrar')+'</span></div>';
      list+='</div>';
    }
    list+='</div>';
  });
  list+='</div>';
  h+=section('Todos los días','Las tres estrellas de cada fila son Las 3 de ese día que diste por hechas: una estrella por cada una. Toca cualquier día para ver el detalle.',list);
  return h;
}

     '<div class="hero-meta"><div class="hero-world">'+esc(wi.n)+'</div>'+
     '<div class="hero-sub">Mundo '+w+' de '+WORLDS.length+' · '+esc(wi.d)+'</div>'+

    '<span class="lg"><i class="cdot" style="background:var(--ext)"></i>Extras <b class="mono">'+t.extra+'</b></span>'+

        '<span class="wn">'+esc(x.n)+'<div class="hero-sub">'+esc(x.d)+'</div></span>'+
        '<span class="wl">Niv. '+((n-1)*5+1)+'–'+(n*5)+'</span></div>';

      '<span class="scost">'+r.cost+'</span>'+

           '<button class="buy no" data-action="buy-cancel">No</button>'
          :'<button class="buy" data-action="buy" data-id="'+r.id+'"'+(can?'':' disabled')+'>Canjear</button>')+

      '<button class="iconbtn" data-action="add-reward">'+IC.plus(18)+'</button></div>';

      pl+='<div class="prow"><span>'+esc(p.name)+'</span><span class="pd">'+esc(shortDate(p.date))+' · −'+p.cost+'</span></div>';
    });
    pl+='</div>';
    h+=section('Canjeado','',pl);
  }

  h+='<p class="intro calm">Esto es un marcador, no un jefe. No hay rachas que romper ni castigo por un día flojo: si hoy no juegas, mañana el contador sigue donde lo dejaste. Tú mandas.</p>';
  return h;
}

/* ============ METAS / OBJETIVOS ============
   Objetivos a medio y largo plazo, con cuenta regresiva, progreso numerico
   opcional, y un check-in diario ("avance hoy?") que va formando un registro
   de acciones. Viven en DB.metas y viajan por el mismo Gist. No tocan la
   logica del dia: solo leen las tareas ya marcadas para poder engancharlas. */
function metaById(id){ return (DB.metas||[]).filter(function(m){return m.id===id;})[0]||null; }
function activeMetas(){ return (DB.metas||[]).filter(function(m){return !m.done;}); }
function metaTouch(m){ m.u=now(); }
/* dias desde hoy hasta la fecha limite (negativo si ya paso) */
function daysTo(k){
  if(!k)return null;
  return Math.round((dateOfKey(k).getTime()-dateOfKey(todayKey()).getTime())/86400000);
}
function metaCountdown(m){
  var n=daysTo(m.deadline);
  if(n==null)return null;
  var cls=n<0?"past":n<=7?"near":n<=30?"mid":"far",label;
  if(n<0)label="Venció hace "+(-n)+(n===-1?" día":" días");
  else if(n===0)label="Vence hoy";
  else label="Quedan "+n+(n===1?" día":" días");
  return {n:n,cls:cls,label:label};
}
/* lee cifras en formato es-ES: el punto es separador de miles y la coma decimal.
   "10.000" -> 10000, "6.200,5" -> 6200.5 */
function parseNum(s){
  s=String(s==null?"":s).replace(/[^0-9.,\-]/g,"").replace(/\./g,"").replace(/,/g,".");
  var v=parseFloat(s); return isNaN(v)?null:v;
}
/* formato es-ES manual (miles con punto, decimales con coma) para que salga
   igual en cualquier navegador, sin depender de los datos de idioma del motor */
function fmtN(v){
  v=Number(v)||0; var neg=v<0; v=Math.abs(v);
  var r=Math.round(v*100)/100, ip=Math.floor(r), dec=Math.round((r-ip)*100);
  var s=String(ip).replace(/\B(?=(\d{3})+(?!\d))/g,".");
  if(dec>0)s+=","+(dec<10?"0"+dec:dec);
  return (neg?"-":"")+s;
}
function withUnit(v,m){ var u=(m&&m.unit||"").trim(); return u?(fmtN(v)+" "+u):fmtN(v); }
function metaProgress(m){
  if(!m||!m.numeric)return null;
  var start=Number(m.start)||0,target=Number(m.target)||0,cur=Number(m.current)||0;
  var span=target-start,adv=cur-start;
  var pct=span!==0?clamp(Math.round((adv/span)*100),0,100):(cur>=target?100:0);
  var left=target-cur, reached=(span>=0)?(cur>=target):(cur<=target);
  if(reached)left=0;
  var rate=null,n=daysTo(m.deadline);
  if(n&&n>0&&!reached&&left>0)rate=left/n;
  return {pct:pct,left:left,rate:rate,reached:reached};
}
function metaDays(m){ return Object.keys(m.checks||{}).length; }
function metaStreak(m){
  var n=0,d=new Date();d.setHours(12,0,0,0);
  for(var i=0;i<400;i++){ if((m.checks||{})[keyOf(d)])n++; else break; d.setDate(d.getDate()-1); }
  return n;
}
/* tareas que hoy has dado por hechas, para poder engancharlas a una meta */
function doneTasksToday(){
  var d=day(),out=[];
  (d.top3||[]).forEach(function(id){ if((d.doneTop||{})[id]){var p=poolById(d,id); if(p)out.push({id:id,text:p.text});} });
  (DB.dailies||[]).forEach(function(x){ if((d.doneDaily||{})[x.id])out.push({id:x.id,text:x.text}); });
  (d.extras||[]).forEach(function(x){ out.push({id:x.id,text:x.text}); });
  return out;
}

function addMeta(){
  var t=String(metaTitle||"").trim();
  if(!t){toast("Ponle un nombre a la meta.");return;}
  var m={id:uid(),title:t.slice(0,90),area:S.metaArea||((DB.areas[0]||{}).id||"neg"),
    deadline:String(metaDeadline||"").trim(),numeric:false,start:0,target:0,current:0,unit:"",
    checks:{},checksOff:{},log:[],createdAt:now(),done:false,u:now()};
  var tg=parseNum(metaTarget);
  if(tg!=null&&tg!==0){
    m.numeric=true; m.target=tg;
    var cu=parseNum(metaCurrent); m.current=(cu==null?0:cu); m.start=0;
    m.unit=String(metaUnit||"").trim().slice(0,6);
  }
  DB.metas=DB.metas||[]; DB.metas.push(m);
  metaTitle="";metaTarget="";metaCurrent="";metaUnit="";metaDeadline="";
  S.addMeta=false; save(); render();
}
function toggleMetaToday(id){
  var m=metaById(id); if(!m)return; m.checks=m.checks||{}; m.checksOff=m.checksOff||{};
  var k=todayKey();
  if(m.checks[k]){ delete m.checks[k]; m.checksOff[k]=now(); }          /* lapida: quitar gana al merge */
  else{ m.checks[k]=now(); delete m.checksOff[k]; S.metaEdit=id; }       /* al marcar Sí, abre el panel para apuntar qué hiciste */
  metaTouch(m); save(); render();
}
function saveMetaCurrent(id){
  var m=metaById(id); if(!m)return;
  var v=parseNum(metaCur); if(v==null){toast("Escribe un número.");return;}
  m.current=v; if(!m.numeric){ m.numeric=true; if(!m.target)m.target=v; }
  metaCur=""; metaTouch(m); save(); render();
}
function addMetaNote(id){
  var m=metaById(id); if(!m)return;
  var t=String(metaNote||"").trim(); if(!t)return;
  m.log=m.log||[]; m.log.push({id:uid(),date:todayKey(),text:t.slice(0,140)});
  m.checks=m.checks||{}; m.checksOff=m.checksOff||{}; m.checks[todayKey()]=now(); delete m.checksOff[todayKey()];
  metaNote=""; metaTouch(m); focusId="metaNote"; focusPos=0; save(); render();
}
function toggleAttach(id,taskId){
  var m=metaById(id); if(!m)return; m.log=m.log||[];
  var k=todayKey();
  var ex=m.log.filter(function(x){return x.taskId===taskId&&x.date===k;})[0];
  if(ex){ m.log=m.log.filter(function(x){return x!==ex;}); }
  else{
    var dt=doneTasksToday().filter(function(x){return x.id===taskId;})[0];
    if(!dt)return;
    m.log.push({id:uid(),date:k,text:dt.text,taskId:taskId});
    m.checks=m.checks||{}; m.checksOff=m.checksOff||{}; m.checks[k]=now(); delete m.checksOff[k];
  }
  metaTouch(m); save(); render();
}
function removeMetaLog(mid,lid){
  var m=metaById(mid); if(!m)return;
  m.log=(m.log||[]).filter(function(x){return x.id!==lid;});
  metaTouch(m); save(); render();
}
function setMetaDeadline(id,v){
  var m=metaById(id); if(!m)return;
  m.deadline=String(v||"").trim(); metaTouch(m); save(); render();
}
function archiveMeta(id){
  var m=metaById(id); if(!m)return;
  m.done=!m.done; if(m.done)S.metaEdit=null; metaTouch(m); save(); render();
}
function removeMeta(id){
  DB.metas=(DB.metas||[]).filter(function(m){return m.id!==id;});
  DB.gone=DB.gone||{}; DB.gone[id]=now();
  S.metaEdit=null; S.metaConfirmDel=null; save(); render();
}

/* tarjeta completa de una meta (pestaña Metas) */
function metaCard(m){
  var cd=metaCountdown(m),pr=metaProgress(m),area=areaById(m.area);
  var k=todayKey(),onToday=!!(m.checks||{})[k],editing=(S.metaEdit===m.id),arch=m.done;
  var h='<div class="goal'+(arch?" done":"")+'">';
  h+='<div class="goal-top"><i class="cdot" style="background:'+area.color+';margin-top:6px"></i>'+
     '<span class="goal-t">'+esc(m.title)+'</span>'+
     (cd?'<span class="cd '+cd.cls+'">'+esc(cd.label)+'</span>':'')+'</div>';
  if(m.deadline) h+='<div class="gsub">Fecha límite · '+esc(prettyDate(m.deadline))+'</div>';
  if(pr){
    h+='<div class="gbar"><i style="width:'+pr.pct+'%;background:'+area.color+'"></i></div>'+
       '<div class="gmeta"><span>Vas por <b>'+esc(withUnit(m.current,m))+'</b> de <b>'+esc(withUnit(m.target,m))+'</b></span><span>'+pr.pct+'%</span></div>'+
       '<div class="gmeta" style="margin-top:4px"><span>'+(pr.reached?'🎯 Meta alcanzada':'Te faltan <b>'+esc(withUnit(pr.left,m))+'</b>')+'</span>'+
       (pr.rate?'<span>ritmo: <b>'+esc(withUnit(Math.ceil(pr.rate),m))+'</b>/día</span>':'')+'</div>';
  }
  if(!arch){
    h+='<div class="dots7">';
    lastNDays(7).forEach(function(dk){ h+='<i class="'+((m.checks||{})[dk]?"on":"")+'"></i>'; });
    h+='</div>';
    var nd=metaDays(m);
    h+='<div class="ask2"><span class="q">'+nd+(nd===1?' día':' días')+' avanzando · racha '+metaStreak(m)+'</span>'+
       '<button class="yn si'+(onToday?" on":"")+'" data-action="meta-today" data-id="'+m.id+'">'+(onToday?IC.check(14)+" Avancé":"¿Avancé hoy?")+'</button></div>';
  }
  /* registro de acciones */
  var log=(m.log||[]).slice().reverse();
  if(log.length){
    h+='<div class="glog">';
    log.slice(0,editing?40:4).forEach(function(x){
      h+='<div class="glog-i"><span class="gd">'+esc(shortDate(x.date))+'</span>'+
         (x.taskId?'<span class="gtag">✓</span>':'')+
         '<span class="gt">'+esc(x.text)+'</span>'+
         (editing?'<button class="ghostx" data-action="meta-log-del" data-id="'+m.id+'" data-log="'+x.id+'">'+IC.x(13)+'</button>':'')+
         '</div>';
    });
    if(!editing&&log.length>4) h+='<div class="glog-more">y '+(log.length-4)+' más…</div>';
    h+='</div>';
  }
  if(!arch){
    h+='<button class="minibtn ghost gtoggle" data-action="meta-edit" data-id="'+m.id+'">'+(editing?"Cerrar":IC.note(13)+" Apuntar / editar")+'</button>';
    if(editing){
      h+='<div class="gpanel">';
      /* apuntar qué hiciste */
      h+='<div class="row"><input id="metaNote" class="inp sm" placeholder="¿Qué hiciste hacia esto?" value="'+esc(metaNote)+'"/>'+
         '<button class="iconbtn" data-action="meta-note" data-id="'+m.id+'">'+IC.plus(18)+'</button></div>';
      /* enganchar desde lo hecho hoy */
      var dts=doneTasksToday();
      if(dts.length){
        h+='<div class="ghint">Sumar desde lo que ya marcaste hecho hoy:</div><div class="chips">';
        dts.forEach(function(dt){
          var on=(m.log||[]).some(function(x){return x.taskId===dt.id&&x.date===k;});
          h+='<button class="chip'+(on?" on":"")+'" data-action="meta-attach" data-id="'+m.id+'" data-task="'+dt.id+'"'+(on?' style="border-color:'+area.color+'"':'')+'>'+
             (on?'✓ ':'+ ')+esc(dt.text.length>34?dt.text.slice(0,32)+"…":dt.text)+'</button>';
        });
        h+='</div>';
      }
      /* cifra */
      h+='<div class="row" style="margin-top:10px"><input id="metaCur" class="inp sm" inputmode="decimal" placeholder="'+(m.numeric?"Actualizar valor (ahora "+esc(withUnit(m.current,m))+")":"Poner un valor numérico")+'" value="'+esc(metaCur)+'"/>'+
         '<button class="iconbtn teal" data-action="meta-cur" data-id="'+m.id+'">'+IC.check(18)+'</button></div>';
      /* fecha limite */
      h+='<div class="gfield"><label>Fecha límite</label><input type="date" class="inp sm" data-mdl="'+m.id+'" value="'+esc(m.deadline||"")+'"/></div>';
      /* zona de control */
      h+='<div class="btnrow" style="margin-top:12px">'+
         '<button data-action="meta-archive" data-id="'+m.id+'">'+IC.trophy(15)+' Conseguida</button>'+
         (S.metaConfirmDel===m.id
            ?'<button class="dgr" data-action="meta-remove" data-id="'+m.id+'">Sí, borrar</button><button data-action="meta-remove-cancel">No</button>'
            :'<button class="dgr" data-action="meta-remove-ask" data-id="'+m.id+'">'+IC.trash(15)+' Borrar</button>')+
         '</div>';
      h+='</div>';
    }
  }else{
    h+='<div class="btnrow" style="margin-top:12px"><button data-action="meta-archive" data-id="'+m.id+'">Reactivar</button></div>';
  }
  h+='</div>';
  return h;
}

/* Al borrar dejamos constancia del borrado, no solo quitamos la fila. Si no,
   el otro aparato aun la tiene, la fusion la vuelve a meter y reaparece sola. */
function bury(d,id){ d.gone=d.gone||{}; d.gone[id]=now(); }
function removePool(id){
  var d=day();
  d.pool=(d.pool||[]).filter(function(x){return x.id!==id;});
  d.top3=(d.top3||[]).filter(function(x){return x!==id;});
  if(d.doneTop)delete d.doneTop[id];
  d.extras=(d.extras||[]).filter(function(x){return x.poolId!==id;});
  bury(d,id);
  d.arr=now(); touchDay(); save(); render();
}
function cycleArea(id){
  var d=day(),ids=(DB.areas||[]).map(function(a){return a.id;});
  (d.pool||[]).forEach(function(p){ if(p.id===id){ var i=ids.indexOf(p.area); p.area=ids[(i+1)%ids.length]; } });
  d.arr=now(); touchDay(); save(); render();
}
function poolById(d,id){ return (d.pool||[]).filter(function(x){return x.id===id;})[0]||null; }
function toggleTop(id){
  var d=day(); d.top3=d.top3||[];
  var i=d.top3.indexOf(id);
  if(i>=0)d.top3.splice(i,1);
  else{
    if(d.top3.length>=topMax()){toast(topMax()===3?"Solo tres. Esa es la gracia.":("Máximo "+topMax()+" esenciales."));return;}
    d.top3.push(id);
    var p=poolById(d,id);
    if(p&&p.extra){ p.extra=false; dropExtraEntry(d,id); }
  }
  d.arr=now(); touchDay(); save(); render();
}
function dropExtraEntry(d,poolId){
  d.extras=(d.extras||[]).filter(function(x){return x.poolId!==poolId;});
}
/* marcar/desmarcar una tarea del vaciado como extra planificada */
function toggleExtraPlan(id){
  var d=day(), p=poolById(d,id); if(!p)return;
  if(p.extra){ p.extra=false; dropExtraEntry(d,id); }
  else{
    p.extra=true;
    var i=(d.top3||[]).indexOf(id);
    if(i>=0)d.top3.splice(i,1);
  }
  d.arr=now(); touchDay(); save(); render();
}
/* por la tarde: dar por hecha (o no) una extra planificada */
function toggleDoneExtra(id){
  var d=day(), p=poolById(d,id); if(!p)return;
  d.extras=d.extras||[]; d.extrasOff=d.extrasOff||{};
  if(extraEntryOf(d,id)){ dropExtraEntry(d,id); d.extrasOff[id]=now(); }        /* lapida: no revivir en el merge */
  else { d.extras.push({id:uid(),poolId:id,text:p.text,area:p.area,ts:now()}); delete d.extrasOff[id]; }
  touchDay(); save(); render();
}
