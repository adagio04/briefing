/* Al borrar dejamos constancia del borrado, no solo quitamos la fila. Si no,
   el otro aparato aun la tiene, la fusion la vuelve a meter y reaparece sola. */
function bury(d,id){ d.gone=d.gone||{}; d.gone[id]=now(); }
function removePool(id){
  var d=day();
  d.pool=(d.pool||[]).filter(function(x){return x.id!==id;});
  d.top3=(d.top3||[]).filter(function(x){return x!==id;});
  if(d.doneTop)delete d.doneTop[id];
  d.extras=(d.extras||[]).filter(function(x){return x.poolId!==id;});
  bury(d,id);
  d.arr=now(); touchDay(); save(); render();
}
function cycleArea(id){
  var d=day(),ids=(DB.areas||[]).map(function(a){return a.id;});
  (d.pool||[]).forEach(function(p){ if(p.id===id){ var i=ids.indexOf(p.area); p.area=ids[(i+1)%ids.length]; } });
  d.arr=now(); touchDay(); save(); render();
}
function poolById(d,id){ return (d.pool||[]).filter(function(x){return x.id===id;})[0]||null; }
function toggleTop(id){
  var d=day(); d.top3=d.top3||[];
  var i=d.top3.indexOf(id);
  if(i>=0)d.top3.splice(i,1);
  else{
    if(d.top3.length>=topMax()){toast(topMax()===3?"Solo tres. Esa es la gracia.":("Máximo "+topMax()+" esenciales."));return;}
    d.top3.push(id);
    var p=poolById(d,id);
    if(p&&p.extra){ p.extra=false; dropExtraEntry(d,id); }
  }
  d.arr=now(); touchDay(); save(); render();
}
function dropExtraEntry(d,poolId){
  d.extras=(d.extras||[]).filter(function(x){return x.poolId!==poolId;});
}
/* marcar/desmarcar una tarea del vaciado como extra planificada */
function toggleExtraPlan(id){
  var d=day(), p=poolById(d,id); if(!p)return;
  if(p.extra){ p.extra=false; dropExtraEntry(d,id); }
  else{
    p.extra=true;
    var i=(d.top3||[]).indexOf(id);
    if(i>=0)d.top3.splice(i,1);
  }
  d.arr=now(); touchDay(); save(); render();
}
/* por la tarde: dar por hecha (o no) una extra planificada */
function toggleDoneExtra(id){
  var d=day(), p=poolById(d,id); if(!p)return;
  d.extras=d.extras||[]; d.extrasOff=d.extrasOff||{};
  if(extraEntryOf(d,id)){ dropExtraEntry(d,id); d.extrasOff[id]=now(); }        /* lapida: no revivir en el merge */
  else { d.extras.push({id:uid(),poolId:id,text:p.text,area:p.area,ts:now()}); delete d.extrasOff[id]; }

/* lo que queda vivo al terminar un día: Las 3 sin marcar + todo lo del vaciado
   que no se hizo. Lo hecho (Las 3 marcadas y las extras cumplidas) no vuelve. */
/* Solo viaja al dia siguiente lo que llegaste a comprometer: Las 3 y lo marcado
   como extra. Lo que quedo suelto en el vaciado muere con el dia, que para eso
   el vaciado es un sitio donde soltar sin que te persiga. */
var MAXCARRY=3;
function pendingOf(d,k){
  var out=[];
  (d.top3||[]).forEach(function(id){
    if((d.doneTop||{})[id])return;
    var p=poolById(d,id); if(p)out.push({text:p.text,area:p.area,from:k,n:(p.carried||0)+1});
  });
  (d.pool||[]).forEach(function(p){
    if((d.top3||[]).indexOf(p.id)>=0)return;
    if(!p.extra)return;
    if(extraEntryOf(d,p.id))return;
    out.push({text:p.text,area:p.area,from:k,n:(p.carried||0)+1});
  });
  return out.filter(function(c){return c.n<=MAXCARRY;});
}
function harvestInto(carry,list){
  var seen={};
  (carry||[]).forEach(function(c){ seen[String(c.text).toLowerCase().trim()]=1; });
  list.forEach(function(c){
    var k=String(c.text).toLowerCase().trim();
    if(!k||seen[k])return;
    seen[k]=1; carry.push(c);
  });
  return carry;
}
function closeDay(){
  var d=day(),k=todayKey();
  DB.carry=harvestInto(DB.carry||[],pendingOf(d,k));

  d.closed=true; touchDay(); save();
  S.justClosed=true;

/* el ultimo dia con vida que quedo sin cerrar, si fue hace tres dias o menos */
function dayToRecover(){
  var tk=todayKey(), ks=allDayKeys().filter(function(k){return k<tk;});
  for(var i=ks.length-1;i>=0;i--){
    var k=ks[i], d=DB.days[k];
    if(!d)continue;
    if(d.closed||d.recoverSeen||d.legacy)continue;
    if(dayFilled(d)<1)continue;
    var gap=Math.round((dateOfKey(tk).getTime()-dateOfKey(k).getTime())/86400000);
    return gap>3?null:k;
  }
  return null;
}

  else if(a==="rec-top"){
    var rd=DB.days[S.intro.k]; if(rd){ rd.doneTop=rd.doneTop||{}; rd.doneTopOff=rd.doneTopOff||{};
      if(rd.doneTop[id]){delete rd.doneTop[id];rd.doneTopOff[id]=now();}else{rd.doneTop[id]=now();delete rd.doneTopOff[id];} rd.u=now(); }
    render();
  }
  else if(a==="rec-daily"){
    var rd2=DB.days[S.intro.k]; if(rd2){ rd2.doneDaily=rd2.doneDaily||{}; rd2.doneDailyOff=rd2.doneDailyOff||{};
      if(rd2.doneDaily[id]){delete rd2.doneDaily[id];rd2.doneDailyOff[id]=now();}else{rd2.doneDaily[id]=now();delete rd2.doneDailyOff[id];} rd2.u=now(); }
    render();
  }
  else if(a==="rec-extra"){
    var rd5=DB.days[S.intro.k];
    if(rd5){
      var p5=poolById(rd5,id);
      if(p5){
        rd5.extras=rd5.extras||[]; rd5.extrasOff=rd5.extrasOff||{};
        var ex5=extraEntryOf(rd5,id);
        if(ex5){ rd5.extras=rd5.extras.filter(function(x){return x!==ex5;}); rd5.extrasOff[id]=now(); }
        else { rd5.extras.push({id:uid(),poolId:id,text:p5.text,area:p5.area,ts:now()}); delete rd5.extrasOff[id]; }
        rd5.u=now();
      }
    }
    render();
  }
  else if(a==="rec-add"){ recAdd(); }
  else if(a==="rec-close"){
    var k3=S.intro.k, rd3=DB.days[k3];
    if(rd3){ rd3.full=dayComplete(rd3); rd3.closed=true; rd3.recoverSeen=true; rd3.u=now(); }
    save(); finishIntro(); toast("Día cerrado. Lo hecho cuenta.");
  }
  else if(a==="rec-skip"){
    var rd4=DB.days[S.intro.k]; if(rd4){ rd4.recoverSeen=true; rd4.u=now(); }
    save(); finishIntro();
  }
  else if(a==="acc"){ S.acc[id]=!S.acc[id]; render(); }
  else if(a==="toggle-game"){
    DB.settings=DB.settings||{};
    DB.settings.game=(DB.settings.game===false);
    if(!DB.settings.game&&S.tab==="prog")S.tab="hoy";
    save(); render();
    toast(DB.settings.game?"Modo juego activado":"Modo simple activado");
  }
  else if(a==="toggle-notebook"){
    DB.settings=DB.settings||{};
    DB.settings.notebook=(DB.settings.notebook===false);
    save(); render();
  }
  else if(a==="save-name"){
    var ni=document.getElementById("nameinp");
    setName(ni?ni.value:"");
    toast(userName()?("Hecho. Hola, "+userName()+"."):"Nombre borrado");
  }
  else if(a==="wel-game"){ S.welGame=(id==="1"); render(); }
  else if(a==="wel-done"){
    var wi=document.getElementById("welname");
    DB.settings=DB.settings||{};
    DB.settings.game=!!S.welGame;
    setName(wi?wi.value:"");
  }
  else if(a==="wel-skip"){
    DB.settings=DB.settings||{};
    DB.settings.game=!!S.welGame;
    DB.settings.greeted=true;
    save(); render();
  }
  else if(a==="toggle-add-reward"){S.addReward=!S.addReward;render();}
  else if(a==="add-reward")addReward();
  else if(a==="remove-reward"){DB.rewards=(DB.rewards||[]).filter(function(r){return r.id!==id;});DB.gone=DB.gone||{};DB.gone[id]=now();save();render();}
  else if(a==="toggle-add-meta"){S.addMeta=!S.addMeta;render();}
  else if(a==="pick-meta-area"){S.metaArea=id;render();}
  else if(a==="add-meta")addMeta();
  else if(a==="meta-today")toggleMetaToday(id);
  else if(a==="meta-edit"){S.metaEdit=(S.metaEdit===id)?null:id;S.metaConfirmDel=null;metaNote="";metaCur="";render();}
  else if(a==="meta-note")addMetaNote(id);
  else if(a==="meta-cur")saveMetaCurrent(id);
  else if(a==="meta-attach"){toggleAttach(id,el.getAttribute("data-task"));}
  else if(a==="meta-log-del"){removeMetaLog(id,el.getAttribute("data-log"));}
  else if(a==="meta-archive")archiveMeta(id);
  else if(a==="meta-remove-ask"){S.metaConfirmDel=id;render();}
  else if(a==="meta-remove-cancel"){S.metaConfirmDel=null;render();}
  else if(a==="meta-remove")removeMeta(id);
  else if(a==="sync-now"){syncNow(false);}
  else if(a==="copy-gid"){copyText(DB.sync.gistId,"ID copiado");}
  else if(a==="toggle-tok"){S.showTok=!S.showTok;render();}
  else if(a==="export")exportJSON();
  else if(a==="import"){var f=document.getElementById("impfile");if(f)f.click();}
  else if(a==="wipe"){
    if(el.getAttribute("data-armed")==="1"){
      DB=emptyDB(); sSet(KDB,DB); render(); toast("Borrado en este dispositivo");
    }else{ el.setAttribute("data-armed","1"); el.textContent="Toca otra vez para confirmar"; }
  }
}
function onInput(e){
  var t=e.target,i=t.id;
  if(i==="draft")draft=t.value;
  else if(i==="dailyDraft")dailyDraft=t.value;
  else if(i==="extraDraft")extraDraft=t.value;
  else if(i==="rwName")rwName=t.value;
  else if(i==="rwCost")rwCost=t.value;
  else if(i==="welname")S.nameDraft=t.value;
  else if(i==="recDraft")recDraft=t.value;
  else if(i==="metaTitle")metaTitle=t.value;
  else if(i==="metaTarget")metaTarget=t.value;
  else if(i==="metaCurrent")metaCurrent=t.value;
  else if(i==="metaUnit")metaUnit=t.value;
  else if(i==="metaDeadline")metaDeadline=t.value;
  else if(i==="metaNote")metaNote=t.value;
  else if(i==="metaCur")metaCur=t.value;
  else if(i==="blkS")blkDraftS=t.value;
  else if(i==="blkE")blkDraftE=t.value;
  else if(i.indexOf("schedS_")===0){ var _w=i.slice(7); schedDrafts[_w]=schedDrafts[_w]||{}; schedDrafts[_w].s=t.value; }
  else if(i.indexOf("schedE_")===0){ var _w2=i.slice(7); schedDrafts[_w2]=schedDrafts[_w2]||{}; schedDrafts[_w2].e=t.value; }
  else if(i==="tokinp"){ setToken(t.value.trim()); paintSyncDot(); }
  else if(i==="gidinp"){ DB.sync.gistId=t.value.trim(); sSet(KDB,DB); }
  else if(t.getAttribute&&t.getAttribute("data-mdl")){ setMetaDeadline(t.getAttribute("data-mdl"),t.value); }
  else if(t.getAttribute&&t.getAttribute("data-area")){
    var aid=t.getAttribute("data-area");
    (DB.areas||[]).forEach(function(a){ if(a.id===aid)a.name=t.value; });
    sSet(KDB,DB); DB.u=now(); schedulePush();
  }
}
function onKeydown(e){
  if(e.key!=="Enter")return;
  var i=e.target.id;
  if(i==="draft"){e.preventDefault();addPool();}
  else if(i==="dailyDraft"){e.preventDefault();addDaily();}
  else if(i==="extraDraft"){e.preventDefault();addExtra();}
  else if(i==="rwName"||i==="rwCost"){e.preventDefault();addReward();}
  else if(i==="welname"){e.preventDefault();var wl=document.getElementById("welname");
    DB.settings=DB.settings||{};DB.settings.game=!!S.welGame;setName(wl?wl.value:"");}
  else if(i==="nameinp"){e.preventDefault();var nx=document.getElementById("nameinp");setName(nx?nx.value:"");}
  else if(i==="metaNote"){e.preventDefault();if(S.metaEdit)addMetaNote(S.metaEdit);}
  else if(i==="metaCur"){e.preventDefault();if(S.metaEdit)saveMetaCurrent(S.metaEdit);}
}
function onChange(e){
  var i=e.target.id,d=day();
  if(i==="histFrom"){ if(e.target.value){ S.histFrom=e.target.value; S.selBucket=null; render(); } }
  else if(i==="histTo"){ if(e.target.value){ S.histTo=e.target.value; S.selBucket=null; render(); } }
  else if(i==="tstart"){ d.workStart=e.target.value||d.workStart; DB.settings.workStart=d.workStart; touchDay(); save(); render(); }
  else if(i==="tend"){ d.workEnd=e.target.value||d.workEnd; DB.settings.workEnd=d.workEnd; touchDay(); save(); render(); }
  else if(i==="impfile"){ if(e.target.files&&e.target.files[0]) importJSON(e.target.files[0]); }
  else if(i==="metaDeadline"){ metaDeadline=e.target.value; }
  else if(i==="blkS"){ blkDraftS=e.target.value; }
  else if(i==="blkE"){ blkDraftE=e.target.value; }
  else if(i.indexOf("schedS_")===0){ var _sw=i.slice(7); schedDrafts[_sw]=schedDrafts[_sw]||{}; schedDrafts[_sw].s=e.target.value; }
  else if(i.indexOf("schedE_")===0){ var _sw2=i.slice(7); schedDrafts[_sw2]=schedDrafts[_sw2]||{}; schedDrafts[_sw2].e=e.target.value; }
  else if(e.target.getAttribute&&e.target.getAttribute("data-mdl")){ setMetaDeadline(e.target.getAttribute("data-mdl"),e.target.value); }
}
document.addEventListener("click",onClick);
document.addEventListener("input",onInput);
document.addEventListener("keydown",onKeydown);
document.addEventListener("change",onChange);

/* iOS: nada de zoom por doble toque ni menú contextual sobre los controles */
document.addEventListener("gesturestart",function(e){e.preventDefault();},{passive:false});
document.addEventListener("contextmenu",function(e){
  var t=e.target;
  if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||(t.closest&&t.closest(".selectable"))))return;
  e.preventDefault();
});
var lastTouch=0;
document.addEventListener("touchend",function(e){
  var t=Date.now();
  if(t-lastTouch<=320) e.preventDefault();
  lastTouch=t;
},{passive:false});

/* ============ arranque ============ */
/* recoge lo que quedó vivo en días anteriores que nunca se cerraron,
   para que nada se pierda por no haber pulsado «Cerrar el día» */
function harvestCarry(){
  var tk=todayKey(),ks=allDayKeys().filter(function(k){return k<tk;}),got=false;
  ks.slice(-14).forEach(function(k){
    var d=DB.days[k]; if(!d||d.harvested)return;
    if(d.legacy){ d.harvested=true; return; } /* los días importados de v1 no traen texto real */
    var list=pendingOf(d,k);
    d.harvested=true; got=true;
    if(list.length) DB.carry=harvestInto(DB.carry||[],list);
  });
  return got;
}
/* mete lo pendiente en el vaciado de hoy, sumando a lo que ya haya y sin duplicar.
   Lo cosechado hoy mismo espera a mañana. */
function applyCarry(){
  var d=day(),tk=todayKey(),moved=false;
  var mine=(DB.carry||[]).filter(function(c){return c.from!==tk;});
  if(!mine.length)return false;
  var have={};
  (d.pool||[]).forEach(function(p){ have[String(p.text).toLowerCase().trim()]=1; });
  d.pool=d.pool||[];
  mine.forEach(function(c){
    var t=c.text||String(c),k=String(t).toLowerCase().trim();
    if(!k||have[k])return;
    have[k]=1; moved=true;
    d.pool.push({id:uid(),text:t,area:c.area||"_",from:c.from||"prev",carried:(c.n||1)});
  });
  DB.carry=(DB.carry||[]).filter(function(c){return c.from===tk;});
  if(moved)touchDay();
  return moved;
}
function boot(){
  sGet(KDB).then(function(stored){
    if(stored&&stored.days){
      DB=stored;
      DB.settings=DB.settings||{workStart:"09:30",workEnd:"19:00",quote:true};
      if(DB.settings.quote===undefined)DB.settings.quote=true;
      if(DB.settings.game===undefined)DB.settings.game=true;
      if(DB.settings.notebook===undefined)DB.settings.notebook=true;
      if(DB.settings.name===undefined)DB.settings.name="";
      if(DB.settings.topMax===undefined)DB.settings.topMax=3;
      if(DB.worldBonus===undefined)DB.worldBonus=0;
      if(DB.seenWorld===undefined)DB.seenWorld=worldOf(levelInfo(totals().total).lvl);
      DB.sync=DB.sync||{gistId:"",lastSync:0};
      DB.areas=(DB.areas&&DB.areas.length)?DB.areas:AREAS_DEFAULT.slice();
      DB.rewards=DB.rewards||REWARDS_DEFAULT.slice();
      DB.purchases=DB.purchases||[];
      DB.dailies=DB.dailies||[];
      DB.days=DB.days||{};
      DB.carry=DB.carry||[];
      DB.metas=DB.metas||[];
    }else{
      var mig=migrateV1();
      if(mig){ DB=mig; toast("Datos anteriores recuperados"); }
    }
    if(DB.settings.weekly===undefined)DB.settings.weekly={};
    if(DB.settings.theme===undefined)DB.settings.theme="dark";
    applyTheme();
    day();
    sealStalePunch();
    ensureTodaySchedule();
    var _rk=dayToRecover();
    if(!needsWelcome()){
      if(!introDone()) S.intro={stage:"hello",k:_rk};          /* primer arranque del día: recibe + arrastra lo de ayer */
      else { S.intro={stage:"splash"}; }  /* resto de arranques: bienvenida, entra al tocar */
    }
    if(!S.intro){ harvestCarry(); applyCarry(); }
    S.area=(DB.areas[0]||{}).id||"neg"; S.extraArea=S.area;
    S.welGame=!(DB.settings&&DB.settings.game===false);
    S.nameDraft=userName();
    day();
    S.ready=true;
    sSet(KDB,DB);
    render();
    if(token()&&DB.sync.gistId) setTimeout(function(){syncNow(true);},600);
  });
}

/* refresca el bloque de trabajo cada 30s (cuenta atrás y cambio de estado),
   sin pisar lo que estés escribiendo */
setInterval(function(){
  if(S.tab!=="hoy"||S.intro)return;
  if(S.rec==="rec"||S.rec==="proc")return;
  var ae=document.activeElement;
  if(ae&&(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA"))return;
  if(document.getElementById("blockline")||document.querySelector(".punch")) render();
},30000);

/* cambio de día con el archivo abierto */
var bootDay=todayKey();
setInterval(function(){
  if(todayKey()!==bootDay){
    bootDay=todayKey();
    sealStalePunch();
    day();
    ensureTodaySchedule();
    if(!introDone()&&!needsWelcome()){ S.intro={stage:"hello",k:dayToRecover()}; }
    else { harvestCarry(); applyCarry(); }
    save({nosync:true});
    S.selDay=null; render();
  }
},60000);

/* al volver a la app, baja cambios del otro dispositivo */
document.addEventListener("visibilitychange",function(){
  if(!document.hidden&&token()&&DB.sync.gistId) syncNow(true);
});

/* anadir algo que hiciste ayer y no llegaste a apuntar */
function recAdd(){
  var t=String(recDraft||"").trim(); if(!t||!S.intro||!S.intro.k)return;
  var d=DB.days[S.intro.k]; if(!d)return;
  var ar=((DB.areas||[])[0]||{}).id||"neg";
  var pid=uid();
  d.pool=d.pool||[]; d.pool.push({id:pid,text:t,area:ar,extra:true});
  d.extras=d.extras||[]; d.extras.push({id:uid(),poolId:pid,text:t,area:ar,ts:now()});
  d.u=now(); recDraft=""; save();
  focusId="recDraft"; focusPos=0; render();
}

boot();
/* si las notificaciones estaban activas, re-registra el service worker al abrir */
if(pushFlag()&&('serviceWorker' in navigator)){ navigator.serviceWorker.register('sw.js').then(function(){ setTimeout(reportState,1500); }).catch(function(){}); }
})();
